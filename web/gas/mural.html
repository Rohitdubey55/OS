   ══════════════════════════════════════ */
.mural-element {

    transition: box-shadow 0.2s ease, outline 0.15s ease;

.mural-element-content {
    width: 100%;
    height: 100%;
    outline: none;
    border: none;
    background: transparent;
    overflow-wrap: anywhere;
    word-break: normal;
    white-space: pre-wrap;
    padding: 0;
    /* Let parent handle padding */
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    cursor: text;
    justify-content: inherit;
    /* Inherit alignment from parent element */
    align-items: inherit;
    flex-grow: 1;
}

.mural-element.shape-el .mural-element-content {
    justify-content: center;
    align-items: center;
    text-align: center;
}

.mural-element.sticky {
    min-width: 20px;
    min-height: 20px;
    padding: 16px;
    border-radius: 4px;
    box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.06),
        0 4px 16px rgba(0, 0, 0, 0.04),
        2px 6px 20px rgba(0, 0, 0, 0.03);
    border: none;
    font-family: 'Inter', -apple-system, sans-serif;
    text-align: left;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    color: #1a1a1a;
    overflow-wrap: anywhere;
    word-break: normal;
    white-space: pre-wrap;
    outline: 2px solid transparent;
    outline-offset: 2px;
    overflow: visible;
    overflow-wrap: break-word;
    position: relative;
}

.mural-element.sticky::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.04) 0%, transparent 100%);
    pointer-events: none;
}

.mural-element.sticky:focus {
    outline: 2px solid var(--mural-accent);
    outline-offset: 2px;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.06),
        0 0 0 4px var(--mural-accent-glow);
}

.mural-element.selected {
    outline: 2px solid var(--mural-accent);
    /* Offset 0 keeps the ring exactly on the element's box edge so there's a SINGLE
       boundary that lines up with the grid (was 1px, which drew a second ring just
       outside the shape's own resting border). */
    outline-offset: 0;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
}

/* Rectangle-family shapes (rect / rounded / ellipse / circle): make the SELECTED boundary
   the shape's OWN border, recoloured to the accent — so the edge you see while selected
   sits exactly where the resting edge is (on the grid line), not 2px outside it via an
   outline. The inset shadow just thickens it inward; the outer edge never moves, so the
   shape stays grid-aligned and there's a single boundary. */
.mural-element.shape-el.rect.selected,
.mural-element.shape-el.rounded.selected,
.mural-element.shape-el.ellipse.selected,
.mural-element.shape-el.circle.selected {
    outline: none;
    border-color: var(--mural-accent);
    box-shadow: inset 0 0 0 1.5px var(--mural-accent), 0 6px 18px rgba(0, 0, 0, 0.10);
}

/* Mural draws its own selection ring, so suppress the GLOBAL :focus-visible outline
   (a themed --saas-accent ring with !important) that otherwise stacks an extra
   coloured boundary on a focused shape or its editable text. */
.mural-element:focus,
.mural-element:focus-visible,
.mural-element-content:focus,
.mural-element-content:focus-visible {
    outline: none !important;
}

}

.mural-element.shape-el:focus {

    outline-offset: 2px;
}

.mural-element.shape-el.circle {
    border-radius: 50%;
}

.mural-element.shape-el.triangle {
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.mural-element.shape-el.diamond {
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}

.mural-element.shape-el.hexagon {

}

    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

/* Rectangles: sharp corners vs rounded (rounded radius is adjustable inline) */
.mural-element.shape-el.rect { border-radius: 0; }
.mural-element.shape-el.rounded { border-radius: 16px; }

/* Additional shapes */
.mural-element.shape-el.ellipse { border-radius: 50%; }
.mural-element.shape-el.pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
.mural-element.shape-el.parallelogram { clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%); }
.mural-element.shape-el.arrow { clip-path: polygon(0% 30%, 60% 30%, 60% 0%, 100% 50%, 60% 100%, 60% 70%, 0% 70%); }

.mural-element.shape-el.plus { clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%); }
/* Clip-path shapes can't render a border cleanly, so drop it for them */
.mural-element.shape-el.triangle,
.mural-element.shape-el.diamond,
.mural-element.shape-el.hexagon,
.mural-element.shape-el.star,
.mural-element.shape-el.pentagon,
.mural-element.shape-el.parallelogram,

/* Shape picker — compact icon grid */
.mural-shape-grid { display: grid; grid-template-columns: repeat(5, 34px); gap: 4px; padding: 4px; }
.mural-shape-btn {

    color: var(--text-2); display: flex; align-items: center; justify-content: center;

}
.mural-shape-btn:hover { background: var(--surface-2); color: var(--text-1); }
.mural-shape-sep { height: 1px; background: var(--border-color); margin: 5px 6px; opacity: .5; }

.mural-element.icon-el {
    background: transparent !important;

    align-items: center;
    justify-content: center;
    color: var(--mural-accent);
    cursor: grab;
    border: none !important;
    box-shadow: none !important;
}

.mural-element.icon-el:focus {
    outline: 2px solid var(--mural-accent);
    background: var(--mural-accent-soft) !important;
}

.mural-element.icon-el i,
.mural-element.icon-el svg {
    width: 90%;
    height: 90%;
    pointer-events: none;
}

/* ── Connection Anchors ── */
.mural-anchor {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--surface-1);
    border: 2px solid var(--mural-accent);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.15s, transform 0.15s, background 0.15s;
    z-index: 10;
    cursor: crosshair;
}

.mural-anchor.top    { top: 0;   left: 50%; }
.mural-anchor.bottom { top: 100%; left: 50%; }
.mural-anchor.left   { top: 50%; left: 0; }
.mural-anchor.right  { top: 50%; left: 100%; }

/* Show anchors when connector tool is active, connector selected, or element hovered */
.mural-element.show-anchors .mural-anchor,
.mural-element:hover .mural-anchor,
.connector-tool-active .mural-element .mural-anchor {
    opacity: 1;
    pointer-events: auto;
}

.mural-anchor:hover {
    transform: translate(-50%, -50%) scale(1.4);
    background: var(--mural-accent);
    box-shadow: 0 0 0 4px var(--mural-accent-glow);
}

/* Highlight the currently connected anchor */
.mural-anchor.connected {
    opacity: 1;
    pointer-events: auto;
    background: var(--mural-accent);
    transform: translate(-50%, -50%) scale(1.2);
    box-shadow: 0 0 0 3px var(--mural-accent-glow);
}

.mural-anchor.connected:hover {
    transform: translate(-50%, -50%) scale(1.5);
}

/* Resize handle */
.mural-resize-handle {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    opacity: 0;
    transition: opacity 0.2s;
}

.mural-element:hover .mural-resize-handle,
.mural-element.selected .mural-resize-handle {
    opacity: 1;
}

.mural-resize-handle::after {
    content: '';
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    border-right: 2px solid rgba(0, 0, 0, 0.2);
    border-bottom: 2px solid rgba(0, 0, 0, 0.2);
}

/* Element Color Indicator Bar */
.mural-element-color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    position: absolute;
    top: 8px;
    right: 8px;
    opacity: 0.5;
}

/* ══════════════════════════════════════
   CONTEXT MENU — Element Actions
   ══════════════════════════════════════ */
.mural-context-menu {
    position: fixed;
    /* Theme-aware opaque surface. Was --mural-glass-bg, which keys off the OS
       prefers-color-scheme — so on a dark OS the menu went dark while the app's
       light theme kept text dark → unreadable dark-on-dark. */
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    border-radius: var(--mural-radius-md);
    padding: 6px;
    box-shadow: var(--mural-shadow-elevated);
    z-index: 2000;
    min-width: 180px;
    /* Never exceed the viewport — scroll instead of being clipped at the bottom. */
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    animation: muralScaleIn 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Compact icon buttons used inside the connector menu (keeps it short). */
.mural-context-menu .mfp-sq { display: flex; align-items: center; justify-content: center; }
.mural-context-menu .mfp-sq i,
.mural-context-menu .mfp-sq svg { width: 17px; height: 17px; }
.mural-context-menu .mfp-sq.active {
    background: var(--mural-accent-soft, #eef0ff);
    border-color: var(--mural-accent, #6366f1);
    color: var(--mural-accent, #6366f1);
}

.mural-context-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--mural-radius-sm);
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-1);
    cursor: pointer;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mural-context-item:hover {
    background: var(--surface-2);
}

.mural-context-item.danger {
    color: var(--mural-danger);
}

.mural-context-item.danger:hover {
    background: var(--mural-danger-soft);
}

.mural-context-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
}

.mural-context-divider {
    height: 1px;
    background: var(--border-color);
    margin: 4px 6px;
    opacity: 0.5;
}

.mural-context-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
    padding: 4px 12px 2px;
    opacity: 0.7;
}

.mural-context-item.active-style {
    color: var(--mural-accent);
    background: var(--mural-accent-soft);
    font-weight: 600;
}

/* ══════════════════════════════════════
   TOOLBAR EXTRAS — Groups & Popovers
   ══════════════════════════════════════ */
.mural-tool-group {
    position: relative;
    display: flex;
}

.mural-tool-popover {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    border-radius: var(--mural-radius-md);
    padding: 8px;
    box-shadow: var(--mural-shadow-elevated);
    display: none;
    flex-direction: column;
    min-width: 140px;
    z-index: 10000;
    opacity: 0;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}

.mural-tool-popover.visible {
    display: flex;
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
}

.mural-popover-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
}

.mural-popover-item:hover {
    background: var(--surface-2);
    color: var(--mural-accent);
}

.mural-popover-item i {
    width: 16px;
    height: 16px;
    opacity: 0.7;
}

/* Icon Library Modal */
.mural-icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 12px;
    max-height: 400px;
    overflow-y: auto;
    padding: 8px;
}

.mural-icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    background: var(--surface-1);
    cursor: pointer;
    transition: all 0.2s;
}

.mural-icon-btn:hover {
    border-color: var(--mural-accent);
    background: var(--mural-accent-soft);
    transform: translateY(-2px);
}

.mural-icon-btn i {
    width: 24px;
    height: 24px;
    color: var(--mural-accent);
}

.mural-icon-btn span {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
}

.mural-color-picker {
    position: fixed;
    background: var(--surface-1);
    backdrop-filter: var(--mural-blur);
    -webkit-backdrop-filter: var(--mural-blur);
    border: 1px solid var(--border-color);
    border-radius: var(--mural-radius-lg);
    padding: 16px;
    box-shadow: var(--mural-shadow-elevated);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 250px;
    max-width: calc(100vw - 32px);
    animation: muralScaleIn 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.mural-picker-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: -4px;
}

.mural-picker-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.mural-color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
    position: relative;
}

.mural-color-swatch:hover {
    transform: scale(1.15);
    border-color: var(--text-2);
}

.mural-color-swatch.active {
    border-color: var(--mural-accent);
    box-shadow: 0 0 0 2px var(--mural-accent-glow);
}

.mural-color-swatch.active::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    font-weight: 700;
    color: rgba(0, 0, 0, 0.5);
}

/* ══════════════════════════════════════
   DASHBOARD — Project Management
   ══════════════════════════════════════ */
.mural-dashboard {
    padding: 8px 28px 120px;
    max-width: 1180px;
    margin: 0 auto;
    animation: muralFadeIn 0.3s ease;
}

.mural-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.mural-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.mural-h2 {
    font-size: 20px;
    font-weight: 750;
    letter-spacing: -0.02em;
    color: var(--text-1);
    margin: 0;
}

.mural-count-badge {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border-color);
    padding: 2px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
}

.mural-header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

.mural-tool-cluster {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border-color);
    border-radius: 12px;
}

.mural-header-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mural-header-btn:hover {
    background: var(--surface-1);
    color: var(--text-1);
    box-shadow: var(--mural-shadow-card);
}

.mural-header-btn:active {
    transform: scale(0.94);
}

.mural-header-btn svg {
    width: 17px;
    height: 17px;
}

.mural-add-btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 11px;
    border: none;
    background: linear-gradient(135deg, var(--mural-accent), #8B5CF6);
    color: white;
    font-weight: 650;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: var(--mural-transition);
    box-shadow: 0 2px 10px var(--mural-accent-glow);
    -webkit-tap-highlight-color: transparent;
}

.mural-add-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--mural-accent-glow);
}

.mural-add-btn:active {
    transform: scale(0.97);
}

.mural-add-btn svg {
    width: 18px;
    height: 18px;
}

/* Category Filter Bar */
.mural-cat-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
}

.mural-cat-bar::-webkit-scrollbar {
    display: none;
}

.mural-cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--surface-1);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mural-cat-pill .mcp-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cat-dot, var(--text-3));
    flex-shrink: 0;
}

.mural-cat-pill:hover {
    color: var(--text-1);
    background: var(--surface-2);
    border-color: var(--text-3);
}

.mural-cat-pill:active {
    transform: scale(0.96);
}

.mural-cat-pill.active {
    background: var(--text-1);
    color: var(--surface-1);
    border-color: var(--text-1);
}

.mural-cat-pill.active .mcp-dot {
    background: var(--surface-1);
}

/* Project Grid */
.mural-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
}

/* ── Card ── */
.mural-project-card {
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform var(--mural-transition), box-shadow var(--mural-transition), border-color var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mural-project-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--mural-shadow-card-hover);
    border-color: color-mix(in srgb, var(--mural-accent) 40%, var(--border-color));
}

.mural-project-card:active {
    transform: translateY(-1px);
}

/* Thumbnail — a mini whiteboard with scattered sticky notes */
.mc-thumb {
    position: relative;
    height: 150px;
    overflow: hidden;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--surface-2);
    background-image:
        radial-gradient(circle, var(--border-color) 1px, transparent 1.4px),
        linear-gradient(135deg, color-mix(in srgb, var(--mural-accent) 5%, var(--surface-2)), var(--surface-2));
    background-size: 18px 18px, 100% 100%;
}

.mc-sticky {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10), 0 1px 2px rgba(0, 0, 0, 0.06);
}

.mc-thumb-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-3);
}

.mc-thumb-empty svg { width: 22px; height: 22px; opacity: 0.5; }
.mc-thumb-empty span { font-size: 12px; font-weight: 500; opacity: 0.75; }

.mc-thumb-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity var(--mural-transition), transform var(--mural-transition);
}

.mural-project-card:hover .mc-thumb-actions {
    opacity: 1;
    transform: translateY(0);
}

.mc-iconbtn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--surface-1);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--mural-shadow-card);
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mc-iconbtn svg { width: 15px; height: 15px; }
.mc-iconbtn:hover { color: var(--text-1); transform: translateY(-1px); }
.mc-iconbtn.mc-del:hover { color: var(--mural-danger); background: var(--mural-danger-soft); border-color: transparent; }

/* Body */
.mc-body {
    padding: 13px 15px 15px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.mc-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1.3;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.mc-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.mc-chip {
    font-size: 11.5px;
    font-weight: 650;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
}

.mc-date { font-size: 12px; color: var(--text-3); }

.mc-count {
    font-size: 12px;
    color: var(--text-3);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
}

/* Empty State */
.mural-empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
    grid-column: 1 / -1;
}

.mural-empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    background: var(--surface-2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
}

.mural-empty-icon svg {
    width: 28px;
    height: 28px;
}

.mural-empty-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 8px;
}

.mural-empty-desc {
    font-size: 14px;
    color: var(--text-3);
    max-width: 300px;
    margin: 0 auto;
    line-height: 1.5;
}

/* ══════════════════════════════════════
   LOADING STATE
   ══════════════════════════════════════ */
.mural-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-3);
    gap: 12px;
}

.mural-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-color);
    border-top-color: var(--mural-accent);
    border-radius: 50%;
    animation: muralSpin 0.6s linear infinite;
}

/* ══════════════════════════════════════
   SAVED INDICATOR
   ══════════════════════════════════════ */
.mural-save-indicator {
    position: fixed;
    top: 64px;
    right: 16px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
    background: var(--mural-glass-bg);
    backdrop-filter: var(--mural-blur);
    -webkit-backdrop-filter: var(--mural-blur);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--mural-glass-border);
    z-index: 1002;
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 4px;
}

.mural-save-indicator.visible {
    opacity: 1;
    transform: translateY(0);
}

.mural-save-indicator.saving {
    color: var(--mural-warning);
}

.mural-save-indicator.saved {
    color: var(--mural-success);
}

/* ══════════════════════════════════════
   UNDO TOAST
   ══════════════════════════════════════ */
.mural-undo-toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-1);
    color: var(--surface-1);
    padding: 10px 16px;
    border-radius: var(--mural-radius-md);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: var(--mural-shadow-elevated);
}

.mural-undo-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
}

.mural-undo-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    font-weight: 700;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 12px;
    transition: var(--mural-transition);
}

.mural-undo-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

/* ══════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════ */
@keyframes muralSlideUp {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@keyframes muralFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes muralScaleIn {
    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes muralSpin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes muralPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.5;
    }
}

/* ══════════════════════════════════════
   RESPONSIVE — Mobile & Tablet
   ══════════════════════════════════════ */
@media (max-width: 768px) {
    .mural-dashboard {
        padding: 16px;
        padding-bottom: 140px;
    }

    .mural-header {
        margin-bottom: 20px;
    }

    .mural-header-title {
        font-size: 26px;
    }

    .mural-add-btn span {
        display: none;
    }

    .mural-add-btn {
        width: 40px;
        padding: 0;
        justify-content: center;
    }

    .mural-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .mural-project-card {
        border-radius: 14px;
    }

    .mc-thumb {
        height: 116px;
    }

    .mc-title {
        font-size: 14.5px;
    }

    /* Canvas — Mobile toolbar */
    .mural-toolbar {
        bottom: 20px;
        padding: 5px;
        gap: 2px;
        border-radius: var(--mural-radius-md);
    }

    .mural-tool {
        width: 40px;
        height: 40px;
        border-radius: 10px;
    }

    .mural-tool svg {
        width: 18px;
        height: 18px;
    }

    .mural-controls {
        right: 12px;
        top: 64px;
        bottom: auto;
    }

    .mural-zoom-btn {
        width: 34px;
        height: 34px;
    }

    .mural-topbar {
        height: 50px;
        padding: 0 12px;
    }

    .mural-project-title-bar {
        font-size: 14px;
        max-width: 140px;
    }

    .mural-tool[data-tooltip]:hover::after {
        display: none;
    }

    .mural-element.sticky {
        min-width: 20px;
        min-height: 20px;
        font-size: 13px;
        padding: 12px;
    }

    .mural-context-menu {
        min-width: 160px;
    }
}

@media (max-width: 480px) {
    .mural-grid {
        grid-template-columns: 1fr;
    }

    .mural-header-title {
        font-size: 24px;
    }

    .mural-toolbar {
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        max-width: calc(100% - 32px);
        justify-content: center;
        overflow: visible;
    }
}

/* ══════════════════════════════════════
   iOS SAFE AREA — Notch & Home Bar
   ══════════════════════════════════════ */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
    .mural-toolbar {
        bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .mural-controls {
        top: calc(64px + env(safe-area-inset-top));
        bottom: auto;
    }

    .mural-topbar {
        padding-top: env(safe-area-inset-top);
        height: calc(56px + env(safe-area-inset-top));
    }

    .mural-dashboard {
        padding-bottom: calc(120px + env(safe-area-inset-bottom));
    }

    .mural-undo-toast {
        bottom: calc(100px + env(safe-area-inset-bottom));
    }
}

/* ══════════════════════════════════════
   TOUCH OPTIMIZATIONS
   ══════════════════════════════════════ */
@media (hover: none) and (pointer: coarse) {
    .mural-tool {
        width: 48px;
        height: 48px;
    }

    .mural-zoom-btn {
        width: 40px;
        height: 40px;
    }

    .mural-cat-pill {
        padding: 10px 18px;
        font-size: 14px;
    }

    .mural-project-del {
        width: 36px;
        height: 36px;
    }

    /* No hover on touch — keep the card edit/delete actions visible */
    .mc-thumb-actions {
        opacity: 1;
        transform: none;
    }

    .mural-back-btn {
        width: 40px;
        height: 40px;
    }

    .mural-context-item {
        padding: 14px 16px;
        font-size: 15px;
    }

    .mural-color-swatch {
        width: 38px;
        height: 38px;
    }
}

/* Prevent accidental browser gestures on canvas */
.mural-page {
    overscroll-behavior: none;
    -webkit-touch-callout: none;
}

/* ══════════════════════════════════════
   HIDE APP CHROME WHEN CANVAS IS OPEN
   The canvas is a full-screen experience —
   hide bottom nav, FAB, and search button.
   ══════════════════════════════════════ */
.mural-page~.mobile-nav,
.mural-page~.fab,
body:has(.mural-page) .mobile-nav,
body:has(.mural-page) .fab,
body:has(.mural-page) .fab-overlay,
body:has(.mural-page) .fab-menu {
    display: none !important;
    pointer-events: none !important;
}

/* ══════════════════════════════════════
   FULL-BLEED CANVAS
   #main is normally capped at max-width:1280px and centred, AND it runs a
   pageEnter animation with `both` fill-mode whose final `transform` value
   makes it a containing block for position:fixed descendants. Together those
   trapped .mural-page inside a 1280px column, leaving dead gutters left and
   right. When the canvas is open, un-cap #main and drop the transform so the
   fixed canvas resolves against the viewport again.
   ══════════════════════════════════════ */
body:has(.mural-page) #main,
#main:has(.mural-page) {
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    animation: none !important;
    transform: none !important;
    filter: none !important;
    perspective: none !important;
    will-change: auto !important;
    contain: none !important;
}

body:has(.mural-page) .main-content,
.main-content:has(.mural-page) {
    padding: 0 !important;
    overflow: hidden !important;
    transform: none !important;
    filter: none !important;
    will-change: auto !important;
    contain: none !important;
}

body:has(.mural-page) .main-header-bar {
    display: none !important;
}

/* Explicit viewport sizing so the canvas fills edge to edge regardless of
   whatever box it happens to be nested in. */
.mural-page {
    width: 100vw;
    width: 100dvw;
    max-width: 100vw;
}
/* --- Project Actions --- */
.mural-project-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mural-project-actions {
    display: flex;
    gap: 8px;
}

.mural-project-edit,
.mural-project-del {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: none;
    background: var(--surface-2);
    color: var(--text-3);
    cursor: pointer;
    transition: all 0.2s;
}

.mural-project-edit:hover {
    background: var(--primary-soft);
    color: var(--primary);
}

.mural-project-del:hover {
    background: var(--danger-soft);
    color: var(--danger);
}
/* ══════════════════════════════════════
   SHORTCUTS MODAL
   ══════════════════════════════════════ */
.mural-shortcuts-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 4px;
}

.mural-shortcut-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    transition: var(--mural-transition);
    cursor: pointer;
}

.mural-shortcut-row:hover {
    border-color: var(--mural-accent);
    background: var(--mural-accent-soft);
}

.mural-shortcut-row.recording {
    border-color: var(--mural-warning);
    background: rgba(245, 158, 11, 0.1);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    animation: muralPulseWarning 1.5s infinite;
}

@keyframes muralPulseWarning {
    0% { border-color: var(--mural-warning); }
    50% { border-color: transparent; }
    100% { border-color: var(--mural-warning); }
}

.mural-shortcut-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.mural-shortcut-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
}

.mural-shortcut-desc {
    font-size: 11px;
    color: var(--text-3);
}

.mural-shortcut-key {
    display: flex;
    align-items: center;
    gap: 4px;
}

.mural-key-kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    border-bottom: 2px solid var(--border-color);
    border-radius: 6px;
    font-family: monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
}



.mural-shortcut-row.recording .mural-key-kbd {
    color: var(--mural-warning);
    border-color: var(--mural-warning);
}

/* ══════════════════════════════════════
   TOGGLE SWITCH
   ══════════════════════════════════════ */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
}
.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--surface-3, #ccc);
    transition: .4s;
    border-radius: 20px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}
input:checked + .slider {
    background-color: var(--mural-accent, #6366F1);
}
input:checked + .slider:before {
    transform: translateX(16px);
}

/* ══════════════════════════════════════
   MARQUEE SELECTION
   ══════════════════════════════════════ */
.mural-marquee {
    position: absolute;
    background: rgba(99, 102, 241, 0.15);
    border: 1.5px solid var(--mural-accent);
    border-radius: 2px;
    pointer-events: none;
    z-index: 99999;
}

/* ══════════════════════════════════════
   SELECTION BOUNDING BOX — Group drag & resize
   ══════════════════════════════════════ */
.mural-selection-box {
    position: absolute;
    border: 1.5px dashed var(--mural-accent);
    border-radius: 4px;
    pointer-events: none;
    z-index: 99998;
    background: rgba(99, 102, 241, 0.04);
}

/* Handles are siblings on the canvas (not inside the box) for reliable PC pointer events */
.mural-sel-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #fff;
    border: 2px solid var(--mural-accent);
    border-radius: 3px;
    pointer-events: auto;
    z-index: 99999;
    transition: box-shadow 0.15s ease;
    touch-action: none;
}

.mural-sel-handle:hover {
    box-shadow: 0 0 0 4px var(--mural-accent-glow);
    transform: scale(1.3);
}

.mural-sel-handle.nw { cursor: nwse-resize; }
.mural-sel-handle.ne { cursor: nesw-resize; }
.mural-sel-handle.sw { cursor: nesw-resize; }
.mural-sel-handle.se { cursor: nwse-resize; }

@media (prefers-color-scheme: dark) {
    .mural-sel-handle {
        background: #2d2d3d;
    }
}

/* ══════════════════════════════════════
   BACKGROUND OPTIONS PANEL & BUTTON
   ══════════════════════════════════════ */
.mural-bg-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: var(--surface-2);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
}

.mural-bg-btn:hover {
    background: var(--mural-accent-soft);
    color: var(--mural-accent);
    transform: scale(1.05);
}

.mural-bg-panel {
    position: fixed;
    z-index: 100000;
    background: var(--surface-1);
    border: 1px solid var(--mural-glass-border);
    border-radius: var(--mural-radius-md);
    padding: 16px;
    min-width: 240px;
    box-shadow: var(--mural-shadow-elevated);
    backdrop-filter: var(--mural-blur);
    -webkit-backdrop-filter: var(--mural-blur);
    animation: muralFadeIn 0.15s ease;
}

@keyframes muralFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

.mural-bg-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
    margin-bottom: 8px;
}

.mural-bg-patterns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.mural-bg-pattern-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
}

.mural-bg-pattern-btn:hover {
    border-color: var(--mural-accent);
    color: var(--mural-accent);
    background: var(--mural-accent-soft);
}

.mural-bg-pattern-btn.active {
    border-color: var(--mural-accent);
    background: var(--mural-accent-soft);
    color: var(--mural-accent);
}

.mural-bg-colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
}

.mural-bg-color-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mural-bg-color-btn:hover {
    transform: scale(1.15);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.mural-bg-color-btn.active {
    border-color: var(--mural-accent);
    box-shadow: 0 0 0 3px var(--mural-accent-glow);
}

/* Icons scale with their element box so they can be resized like shapes/stickies */
.mural-element.icon-el { display: flex; align-items: center; justify-content: center; }
.mural-element.icon-el .mural-element-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.mural-element.icon-el svg { width: 78%; height: 78%; }

/* Draggable toolbar grip (#2) */
.mural-tool-grip { display: flex; align-items: center; justify-content: center; width: 18px; cursor: grab; color: var(--text-3, #94a3b8); flex-shrink: 0; touch-action: none; }
.mural-tool-grip:active { cursor: grabbing; }

/* Format panel (#4 text, #7 line/arrow, fill) */
.mural-format-pop { display: none; position: absolute; bottom: 120%; right: 0; width: 244px; background: var(--surface-1, #fff); border: 1px solid var(--border-color, #e2e8f0); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.22); padding: 12px; z-index: 10000; }
.mural-format-pop.open { display: block; }
.mfp-sec { padding: 8px 0; border-bottom: 1px solid var(--border-color, #eef2f6); }
.mfp-sec:last-child { border-bottom: none; padding-bottom: 0; }
.mfp-sec:first-child { padding-top: 0; }
.mfp-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3, #94a3b8); margin-bottom: 7px; }
.mfp-swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.mfp-sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.14); cursor: pointer; padding: 0; position: relative; overflow: hidden; }
.mfp-sw.active { box-shadow: 0 0 0 2px var(--surface-1, #fff), 0 0 0 4px var(--mural-accent, #6366F1); }
.mfp-custom { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text-2, #475569); background: var(--surface-2, #f1f5f9); }
.mfp-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.mfp-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.mfp-row:last-child { margin-bottom: 0; }
.mfp-btn { flex: 1; min-width: 54px; font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border-color, #e2e8f0); background: var(--surface-1, #fff); color: var(--text-2, #475569); border-radius: 8px; padding: 7px 8px; cursor: pointer; white-space: nowrap; }
.mfp-btn:hover { background: var(--surface-2, #f1f5f9); color: var(--text-1, #0f172a); }
.mfp-sq { flex: 0 0 auto; min-width: 36px; }

/* ══════════════════════════════════════
   BOARD: full screen on desktop too
   The desktop sidebar sat on top of the left of the board, hiding the
   back button and title. While a board is open it takes the whole window;
   the "Boards" button is the way out.
   ══════════════════════════════════════ */
body:has(.mural-page) .sidebar {
    display: none !important;
}

.mural-back-btn {
    width: auto;
    min-width: 36px;
    padding: 0 12px 0 9px;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
}
.mural-back-label { line-height: 1; }
@media (max-width: 480px) {
    .mural-back-btn { padding: 0; width: 40px; }
    .mural-back-label { display: none; }
}

/* ── Scrollbars ── */
.mural-sb {
    position: absolute;
    z-index: 60;
    border-radius: 6px;
    background: transparent;
    transition: opacity .25s ease, background .2s ease;
    opacity: .55;
    touch-action: none;
}
.mural-sb-y { right: 3px; top: calc(64px + env(safe-area-inset-top, 0px)); bottom: 14px; width: 10px; }
.mural-sb-x { left: 6px; right: 16px; bottom: 3px; height: 10px; }
.mural-sb-thumb {
    position: absolute;
    left: 0; top: 0;
    border-radius: 6px;
    background: var(--text-3, #9aa0ad);
    opacity: .55;
    cursor: grab;
    transition: opacity .2s ease;
}
.mural-sb-y .mural-sb-thumb { width: 100%; }
.mural-sb-x .mural-sb-thumb { height: 100%; }
.mural-page.mural-sb-active .mural-sb,
.mural-sb:hover,
.mural-sb.dragging { opacity: 1; }
.mural-sb:hover { background: rgba(127, 127, 127, .10); }
.mural-sb:hover .mural-sb-thumb,
.mural-sb.dragging .mural-sb-thumb { opacity: .9; cursor: grabbing; }
.mural-sb.is-full { opacity: 0 !important; pointer-events: none; }
@media (hover: none) and (pointer: coarse) {
    .mural-sb { width: auto; pointer-events: none; opacity: 0; }
    .mural-sb-y { width: 4px; }
    .mural-sb-x { height: 4px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
    .mural-page.mural-sb-active .mural-sb { opacity: .8; }
}

/* Hold Space = hand tool: show the hand everywhere on the board, even over items */
.mural-page.mural-space-pan,
.mural-page.mural-space-pan .mural-canvas,
.mural-page.mural-space-pan .mural-canvas * { cursor: grab !important; }
.mural-page.mural-space-grabbing,
.mural-page.mural-space-grabbing .mural-canvas,
.mural-page.mural-space-grabbing .mural-canvas * { cursor: grabbing !important; }
.mural-page.mural-space-pan .mural-canvas * { user-select: none !important; }

/* ══════════════════════════════════════
   TOP BAR: Select (multi) + Arrange
   ══════════════════════════════════════ */
.mural-multi-btn,
.mural-arrange-btn {
    height: 36px;
    padding: 0 11px;
    border-radius: 10px;
    border: none;
    background: var(--surface-2);
    color: var(--text-2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--mural-transition);
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
}
.mural-multi-btn:hover,
.mural-arrange-btn:not(:disabled):hover { background: var(--mural-accent-soft); color: var(--mural-accent); }
.mural-multi-btn.active { background: var(--mural-accent); color: #fff; }
.mural-arrange-btn:disabled { opacity: .45; cursor: default; }
.mural-arrange-btn.ready { background: var(--mural-accent-soft); color: var(--mural-accent); }
.mural-arr-count {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--mural-accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
}
.mural-arr-count:empty { display: none; }
@media (max-width: 640px) {
    .mural-tb-label { display: none; }
    .mural-multi-btn, .mural-arrange-btn { padding: 0 9px; }
    .mural-topbar-right { gap: 4px; }
    .mural-zoom-badge { display: none; }
}

.mural-arr-menu {
    position: fixed;
    z-index: 10050;
    width: 292px;
    max-width: calc(100vw - 16px);
    padding: 10px;
    border-radius: 14px;
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    box-shadow: 0 12px 36px rgba(0, 0, 0, .16);
    animation: muralArrIn .14s ease;
}
@keyframes muralArrIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.mural-arr-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; font-size: 13px; font-weight: 700; color: var(--text-1); }
.mural-arr-link { display: inline-flex; align-items: center; gap: 5px; border: none; background: none; color: var(--mural-accent); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.mural-arr-link:hover { background: var(--mural-accent-soft); }
.mural-arr-link svg { width: 15px; height: 15px; }
.mural-arr-sec { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); padding: 8px 4px 6px; }
.mural-arr-grid3, .mural-arr-grid2 { display: grid; gap: 6px; }
.mural-arr-grid3 { grid-template-columns: repeat(3, 1fr); }
.mural-arr-grid2 { grid-template-columns: repeat(2, 1fr); }
.mural-arr-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 9px 4px 7px; border-radius: 10px; border: 1px solid transparent;
    background: var(--surface-2); color: var(--text-1); font-size: 11.5px; font-weight: 600; cursor: pointer;
}
.mural-arr-item:hover:not(:disabled) { border-color: var(--mural-accent); color: var(--mural-accent); background: var(--mural-accent-soft); }
.mural-arr-item:disabled { opacity: .4; cursor: default; }
.mural-arr-clear { margin-top: 10px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border: none; border-radius: 10px; background: none; color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.mural-arr-clear:hover { background: var(--surface-2); }
.mural-arr-clear svg { width: 14px; height: 14px; }

/* ══════════════════════════════════════
   SUB-BOARDS: element that opens its own mural
   ══════════════════════════════════════ */
.mural-element.has-board { box-shadow: inset 0 0 0 2px rgba(99, 102, 241, .35), 0 2px 6px rgba(0,0,0,.06); }
.mural-el-board-link {
    position: absolute;
    top: 4px; right: 4px;
    width: 24px; height: 24px;
    border-radius: 7px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--mural-accent, #6366f1);
    color: #fff;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
    transition: transform .15s ease;
}
.mural-el-board-link:hover { transform: scale(1.1); }
@media (hover: none) and (pointer: coarse) {
    .mural-el-board-link { width: 30px; height: 30px; top: 3px; right: 3px; }
}

/* ══════════════════════════════════════
   EXPORT
   ══════════════════════════════════════ */
.mural-export-btn {
    height: 36px; padding: 0 11px; border-radius: 10px; border: none;
    background: var(--surface-2); color: var(--text-2);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: var(--mural-transition); -webkit-tap-highlight-color: transparent;
}
.mural-export-btn:hover { background: var(--mural-accent-soft); color: var(--mural-accent); }
.mural-export-btn.busy { opacity: .6; pointer-events: none; }
.mural-export-btn.busy svg { animation: muralExpPulse 1s ease-in-out infinite; }
@keyframes muralExpPulse { 50% { transform: translateY(2px); } }
@media (max-width: 640px) { .mural-export-btn { padding: 0 9px; } }
.mural-exp-menu { width: 270px; }
.mural-exp-scope { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; margin: 0 0 8px; border-radius: 10px; background: var(--surface-2); }
.mural-exp-scope button { border: none; background: none; padding: 7px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.mural-exp-scope button.on { background: var(--surface-1); color: var(--text-1); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.mural-exp-item {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 10px; border: none; border-radius: 10px; background: none; color: var(--text-1); cursor: pointer;
}
.mural-exp-item:hover { background: var(--mural-accent-soft); }
.mural-exp-item svg { flex-shrink: 0; color: var(--mural-accent); }

function escapeHtml(str) {

// Sheet values come back with '' for empty cells — drop them so the code sees "not set"
function _m2Clean(o) {

        if (v === '' || v === null || v === undefined) return;
        if (v === 'TRUE') v = true; else if (v === 'FALSE') v = false;
        c[k] = v;
    });
    return c;
}
var _M2_VOLATILE = { updated_at: 1, updated_by: 1, created_at: 1, created_by: 1, user_id: 1 };
function _m2Key(el) {
    var keys = Object.keys(el || {}).filter(function (k) { return !_M2_VOLATILE[k] && el[k] !== '' && el[k] !== null && el[k] !== undefined; }).sort();
    return JSON.stringify(keys.map(function (k) { var v = el[k]; return [k, typeof v === 'number' ? Math.round(v * 100) / 100 : String(v)]; }));
}

// Last known saved state of every item: id → {key, pid}
var _m2Base = {};
var _m2Ver = {};
function _m2SetBase(el) { _m2Base[String(el.id)] = { key: _m2Key(el), pid: String(el.project_id) }; }

function _m2Delta(pid, list) {
    var upserts = [], ids = {};
    (list || []).forEach(function (el) {
        if (!el || el.id === undefined) return;
        if (String(el.id).indexOf('temp_line_') === 0 && typeof muralDrawingLine !== 'undefined' && muralDrawingLine && muralDrawingLine.id === el.id) return;
        ids[String(el.id)] = true;
        var b = _m2Base[String(el.id)];

    });
    var deletes = Object.keys(_m2Base).filter(function (id) { return _m2Base[id].pid === String(pid) && !ids[id]; });
    return { upserts: upserts, deletes: deletes };
}

async function apiGet(key) {
    var rows = await _m2run('mural2Get', key);
    rows = (rows || []).map(_m2Clean);
    if (key === 'mural_elements') rows.forEach(_m2SetBase);

async function _m2SendDelta(pid, d) {
    var before = _m2Ver[pid] || 0;
    var res = await _m2run('mural2Post', { action: 'syncMuralDelta', payload: { project_id: pid, upserts: d.upserts, deletes: d.deletes } });
    if (res && res.success) {
        d.upserts.forEach(function (el) { el.project_id = el.project_id || pid; _m2SetBase(el); });
        d.deletes.forEach(function (id) { delete _m2Base[id]; });
        if (res.version !== undefined) {
            // someone else also saved in between → pull their changes
            if (before && res.version > before + 1) setTimeout(function () { _m2Pull(pid); }, 50);
            _m2Ver[pid] = res.version;
        }
    }
    return res;
}

async function apiPost(req, extra) {
    // Mural keyboard-shortcut settings → kept per person in this browser
    if (typeof req === 'string') {
        try { localStorage.setItem('m2.settings', JSON.stringify(extra && extra.payload ? extra.payload : extra)); } catch (_) {}

        return _m2SendDelta(pid, d);

    var res = await _m2run('mural2Post', req);
    if (req && req.action === 'syncMuralElements' && res && res.success) {

    return res;

async function renderMural() {

/* ═══════════════════════════════════════

async function renderMuralDashboard() {
    const main = muralHost();

    // Use preloaded data from state if available, otherwise fetch
    if (state.data.mural_projects && muralProjects.length === 0) {
        muralProjects = (state.data.mural_projects || []).map(_m2Clean).map(function (p) { if (!p.title && p.name) p.title = p.name; return p; });
        muralCategories = state.data.mural_categories || [];
    }
    if (muralProjects.length === 0 && !state.data.mural_projects) {
        main.innerHTML = `
            <div class="mural-loading">
                <div class="mural-spinner"></div>
                <span>Loading projects…</span>
            </div>`;
        await loadMuralDashboardData();
    }

    let filtered = muralProjects.filter(p => !_muralParentOf(p));
    if (muralActiveCategory !== 'all') {
        filtered = filtered.filter(p => p.category === muralActiveCategory);
    }

    // Count elements per project — use preloaded data
    let elementCounts = {};
    try {
        const allEls = state.data.mural_elements || await apiGet('mural_elements');
        (allEls || []).forEach(el => {
            const pid = String(el.project_id);
            elementCounts[pid] = (elementCounts[pid] || 0) + 1;
        });
    } catch (e) { /* silent */ }

    main.innerHTML = `
        <div class="mural-dashboard">
            <div class="mural-header">
                <div class="mural-header-left">
                    <h2 class="mural-h2">Projects</h2>
                    <span class="mural-count-badge">${muralProjects.filter(p => !_muralParentOf(p)).length}</span>
                </div>
                <div class="mural-header-actions">
                    <div class="mural-tool-cluster">
                        <button class="mural-header-btn" onclick="muralImportBoardFile()" title="Import board file">
                            <i data-lucide="upload"></i>
                        </button>
                        <button class="mural-header-btn" onclick="openMuralCategoryManager()" title="Edit categories">
                            <i data-lucide="tag"></i>
                        </button>
                        <button class="mural-header-btn" onclick="openMuralShortcutsModal()" title="Keyboard shortcuts">
                            <i data-lucide="keyboard"></i>
                        </button>
                        <button class="mural-header-btn" onclick="repairMuralData()" title="Repair data & remove duplicates">
                            <i data-lucide="wrench"></i>
                        </button>
                    </div>
                    <button class="mural-add-btn" onclick="openNewMuralProjectModal()">
                        <i data-lucide="plus"></i>
                        <span>New Project</span>
                    </button>
                </div>
            </div>

            ${muralCategories.length > 0 ? `
            <div class="mural-cat-bar">
                <button class="mural-cat-pill ${muralActiveCategory === 'all' ? 'active' : ''}" style="--cat-dot:var(--mural-accent)" onclick="filterMuralBy('all')">
                    <span class="mcp-dot"></span>All
                </button>
                ${muralCategories.map(cat => {
        const cc = _muralCatColor(cat.name);
        return `<button class="mural-cat-pill ${muralActiveCategory === cat.name ? 'active' : ''}" style="--cat-dot:${cc.dot}" onclick="filterMuralBy('${escapeHtml(cat.name)}')">
                    <span class="mcp-dot"></span>${escapeHtml(cat.name)}
                </button>`;
    }).join('')}
            </div>` : ''}

            <div class="mural-grid">
                ${filtered.length === 0 ? `
                    <div class="mural-empty">
                        <div class="mural-empty-icon"><i data-lucide="layout-dashboard" style="width:28px;height:28px"></i></div>
                        <div class="mural-empty-title">No projects yet</div>
                        <div class="mural-empty-desc">Create your first mural project to start organizing ideas on an infinite canvas.</div>
                    </div>
                ` : ''}
                ${filtered.map(project => {
        const count = elementCounts[String(project.id)] || 0;
        const projectEls = (muralElements || []).filter(el => String(el.project_id) === String(project.id));
        const cc = _muralCatColor(project.category);
        const catName = project.category || 'Uncategorized';
        return `
                    <div class="mural-project-card" onclick="openMuralProject('${project.id}')">
                        <div class="mc-thumb">
                            ${_muralProjectPreview(count, projectEls)}
                            <div class="mc-thumb-actions">
                                <button class="mc-iconbtn" onclick="event.stopPropagation(); openEditMuralProjectModal('${project.id}')" title="Rename">
                                    <i data-lucide="pencil"></i>
                                </button>
                                <button class="mc-iconbtn mc-del" onclick="event.stopPropagation(); deleteMuralProject('${project.id}')" title="Delete">
                                    <i data-lucide="trash-2"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mc-body">
                            <div class="mc-title">${escapeHtml(project.title)}</div>
                            <div class="mc-meta">
                                <span class="mc-chip" style="background:${cc.bg}; color:${cc.fg}">${escapeHtml(catName)}</span>
                                <span class="mc-date">${formatMuralDate(project.created_at)}</span>
                                <span class="mc-count">${count} element${count !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                    </div>`;
    }).join('')}
            </div>
        </div>
    `;

    if (window.lucide) lucide.createIcons();
}

// Deterministic soft colour per category (chip bg/text + filter dot). Uncategorized = grey.
function _muralCatColor(name) {
    if (!name || name === 'Uncategorized') {
        return { bg: 'var(--surface-3)', fg: 'var(--text-3)', dot: 'var(--text-3)' };
    }
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return {
        bg: `hsla(${h}, 70%, 55%, 0.15)`,
        fg: `hsl(${h}, 60%, 42%)`,
        dot: `hsl(${h}, 65%, 58%)`
    };
}

// Scattered sticky-note positions for the card thumbnail (a mini whiteboard).
const _MURAL_PREVIEW_POS = [
    { l: '10%', t: '20%', r: '-7deg' },
    { l: '36%', t: '34%', r: '5deg' },
    { l: '62%', t: '16%', r: '-4deg' },
    { l: '20%', t: '54%', r: '6deg' },
    { l: '50%', t: '58%', r: '-6deg' },
    { l: '74%', t: '50%', r: '4deg' }
];

function _muralProjectPreview(count, projectEls) {
    if (!count) {
        return `<div class="mc-thumb-empty"><i data-lucide="sparkles"></i><span>Empty canvas</span></div>`;
    }
    let colors = (projectEls || [])
        .map(e => e && e.color)
        .filter(c => typeof c === 'string' && (c[0] === '#' || c.startsWith('rgb')) && c !== 'transparent');
    const n = Math.min(count, _MURAL_PREVIEW_POS.length);
    while (colors.length < n) colors.push(MURAL_COLORS[colors.length % MURAL_COLORS.length]);
    let html = '';
    for (let i = 0; i < n; i++) {
        const p = _MURAL_PREVIEW_POS[i];
        const c = colors[i] || MURAL_COLORS[i % MURAL_COLORS.length];
        html += `<span class="mc-sticky" style="left:${p.l}; top:${p.t}; transform:rotate(${p.r}); background:${c}"></span>`;
    }
    return html;
}

function formatMuralDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return `${days}d ago`;
    if (days < 30) return `${Math.floor(days / 7)}w ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function loadMuralDashboardData() {
    try {
        const [projRes, catRes] = await Promise.all([
            apiGet('mural_projects'),
            apiGet('mural_categories')
        ]);
        muralProjects = projRes || [];
        muralCategories = catRes || [];
        // Sync with global state for dashboard counts
        state.data.mural_projects = muralProjects;
        state.data.mural_categories = muralCategories;
    } catch (err) {
        console.error('Error loading dashboard data:', err);
        toast('Failed to load projects');
    }
}

function filterMuralBy(cat) {
    muralActiveCategory = cat;
    renderMuralDashboard();
}

function openMuralProject(id) {

function exitMuralProject() {
    muralSpacePan = null;

    muralElements = [];
    muralTransform = { x: 0, y: 0, scale: 1 };
