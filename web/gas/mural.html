    dismissMuralPopups();
    // Restore app chrome
    hideMuralAppChrome(false);
    renderMural();
}

function hideMuralAppChrome(hide) {
    const selectors = ['.mobile-nav', '.fab', '.fab-overlay', '.fab-menu', '.ai-fab', '.main-header-bar'];
    selectors.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
            if (hide) {
                el.style.setProperty('display', 'none', 'important');
                el.style.setProperty('pointer-events', 'none', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
            } else {
                el.style.removeProperty('display');
                el.style.removeProperty('pointer-events');
                el.style.removeProperty('visibility');
            }
        });
    });
    // Leaving the editor: remove the floating toolbar we portaled onto <body>
    // (it lives outside #main now, so a view re-render won't clean it up).
    if (!hide) {
        document.querySelectorAll('body > #muralToolbar').forEach(n => n.remove());
    }
}
// Exposed so routeTo() can restore the chrome if the user leaves the editor
// through the sidebar instead of the in-editor back button.
window.hideMuralAppChrome = hideMuralAppChrome;

async function loadMuralElements() {
    try {
        // Always fetch fresh data for mural elements to avoid stale UI
        const res = await apiGet('mural_elements');
        // Sync with global state for dashboard counts
        state.data.mural_elements = res || [];
        muralElements = (res || []).filter(el => String(el.project_id) === String(muralActiveProjectId));
        renderMuralElementsDOM();
    } catch (err) {
        console.error('Error loading elements:', err);
        toast('Failed to load canvas elements');
    }
}

function renderMuralElementsDOM() {
    const canvas = document.getElementById('muralCanvas');
    if (!canvas) return;

    // Preserve the SVG overlay, clear everything else
    const svgOverlay = document.getElementById('muralConnectorSvg');
    canvas.innerHTML = '';
    if (svgOverlay) {
        canvas.appendChild(svgOverlay);
    } else {
        // Re-create SVG if it was lost
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.id = 'muralConnectorSvg';
        svg.classList.add('mural-connector-svg');
        svg.setAttribute('width', '10000');
        svg.setAttribute('height', '10000');
        svg.innerHTML = `
            <defs>
                <marker id="mural-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
                    <polygon points="0 0, 10 3.5, 0 7" fill="context-stroke" />
                </marker>
                <marker id="mural-arrowhead-selected" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
                    <polygon points="0 0, 10 3.5, 0 7" fill="context-stroke" />
                </marker>
                <marker id="mural-arrowhead-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
                    <polygon points="10 0, 0 3.5, 10 7" fill="context-stroke" />
                </marker>
                <marker id="mural-arrowhead-start-selected" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
                    <polygon points="10 0, 0 3.5, 10 7" fill="context-stroke" />
                </marker>
                <marker id="mural-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
                    <circle cx="4" cy="4" r="3" fill="context-stroke" />
                </marker>
                <marker id="mural-dot-selected" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
                    <circle cx="4" cy="4" r="3" fill="context-stroke" />
                </marker>
            </defs>`;
        canvas.appendChild(svg);
    }

    // Separate connectors from regular elements
    muralConnectors = muralElements.filter(el => el.type === 'connector');
    const regularElements = muralElements.filter(el => el.type !== 'connector');

    regularElements.forEach(el => {
        canvas.appendChild(createMuralElementDOM(el));
    });

    // Render all connectors
    renderAllMuralConnectors();
}

function createMuralElementDOM(data) {
    const div = document.createElement('div');
    const elType = data.type || 'sticky';
    let className = 'mural-element';
    if (elType === 'sticky') className += ' sticky';
    else if (elType === 'text') className += ' text-el';
    else if (elType === 'shape') className += ` shape-el ${data.shape || ''}`;
    else if (elType === 'icon') className += ' icon-el';
    else if (elType === 'drawing') className += ' drawing-el';

    div.className = className;
    if (muralSelectedElementIds.includes(data.id)) div.classList.add('selected');
    div.id = `mural-el-${data.id}`;
    div.style.left = `${data.x || 0}px`;
    div.style.top = `${data.y || 0}px`;
    if (data.w) div.style.width = `${data.w}px`;
    if (data.h) div.style.height = `${data.h}px`;
    if (data.color && elType !== 'icon' && elType !== 'drawing') div.style.backgroundColor = data.color;
    if (data.color && elType === 'icon') div.style.color = data.color;
    // Adjustable corner radius for rectangles (rect = sharp default, rounded = curved)
    if (elType === 'shape' && (data.shape === 'rect' || data.shape === 'rounded')
        && data.border_radius != null && data.border_radius !== '') {
        div.style.borderRadius = `${Number(data.border_radius)}px`;
    }
    div.style.zIndex = data.z_index || 1;

    // Content wrapper for text isolation
    const content = document.createElement('div');
    content.className = 'mural-element-content';
    // Per-element text formatting (font size / colour / bold / align)
    if (data.font_size) content.style.fontSize = `${data.font_size}px`;
    if (data.text_color) content.style.color = data.text_color;
    if (data.bold === true || data.bold === 'true') content.style.fontWeight = '700';
    if (data.text_align) _muralApplyTextAlign(content, data.text_align);
    div.appendChild(content);

    // Element that opens its own board (sub-mural)
    if (data.link_project_id) {
        div.classList.add('has-board');
        const link = document.createElement('button');
        link.className = 'mural-el-board-link';
        link.title = 'Open this board';
        link.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
        ['pointerdown', 'mousedown', 'touchstart', 'dblclick'].forEach(t => link.addEventListener(t, ev => ev.stopPropagation()));
        link.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); muralOpenLinkedBoard(data.id); });
        div.appendChild(link);
    }

    // Content: Icons use <i> tags, Others use text
    if (elType === 'icon') {
        content.contentEditable = false;
        content.innerHTML = `<i data-lucide="${data.content || 'smile'}"></i>`;
    } else if (elType === 'drawing') {
        content.contentEditable = false;
        _muralPaintDrawing(div, data);
    } else {
        content.contentEditable = true;
        content.spellcheck = false;
        content.innerText = data.content || '';
        content.addEventListener('input', () => {
            // Keep local state updated for fast UI, but don't autosave to server
            if (data.id) {
                const el = muralElements.find(item => String(item.id) === String(data.id));
                if (el) el.content = content.innerText;
            }
        });
    }

    // Prevent drag while editing text
    content.addEventListener('focus', () => {
        div.style.cursor = 'text';
    });
    content.addEventListener('blur', () => {
        div.style.cursor = 'move';
        // Content is already updated in 'input' event, no server sync on blur
    });

    // Add connection anchors (only for non-connectors)
    const elTypeFinal = data.type || 'sticky';
    if (elTypeFinal !== 'connector' && elTypeFinal !== 'drawing') {
        ['top', 'bottom', 'left', 'right'].forEach(side => {
            const anchor = document.createElement('div');
            anchor.className = `mural-anchor ${side}`;
            anchor.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                handleAnchorClick(data.id, side, e);
            });
            div.appendChild(anchor);
        });
    }

    // Add resize handle for sticky notes, shapes, and icons
    if (elType === 'sticky' || elType === 'shape' || elType === 'icon' || elType === 'drawing') {
        const handle = document.createElement('div');
        handle.className = 'mural-resize-handle';
        handle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            snapshotElementsForUndo([data.id], 'resize');
            muralIsResizing = true;
            muralSelectedElementIds = [data.id];
            muralResizeStart = {
                w: data.w || 150,
                h: data.h || 150,
                x: e.clientX,
                y: e.clientY
            };
            highlightMuralElements([data.id]);
        });
        div.appendChild(handle);
    }

    // Pointer events for drag
    div.addEventListener('pointerdown', (e) => {
        if (muralIsResizing) return;
        if (document.activeElement === div && div.contentEditable === 'true') return; // Don't drag while typing

        // If hand/pen tool is active, let the event bubble to the page (pan / draw)
        if (muralActiveTool === 'hand' || muralActiveTool === 'pen') return;

        e.stopPropagation();

        // ── Connector tool: click to connect ──
        if (muralActiveTool === 'connector') {
            handleConnectorClick(data.id, e);
            return;
        }

        if (e.shiftKey || e.metaKey || e.ctrlKey || muralMultiSelect) {
            // Toggle selection
            if (muralSelectedElementIds.includes(data.id)) {
                muralSelectedElementIds = muralSelectedElementIds.filter(id => id !== data.id);
            } else {
                muralSelectedElementIds.push(data.id);
            }
        } else {
            // Single select (if not already part of a multi-selection)
            if (!muralSelectedElementIds.includes(data.id)) {
                muralSelectedElementIds = [data.id];
            }
        }
        
        muralSelectedConnectorId = null;
        highlightMuralElements(muralSelectedElementIds);
        highlightMuralConnector(null);

        if (muralActiveTool === 'select') {
            muralIsDragging = true;
            muralDragStart = { x: e.clientX, y: e.clientY };
            div.setPointerCapture(e.pointerId);
        }
    });

    // Context menu (long press / right click)
    div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        e.preventDefault();
        e.stopPropagation();
        if (!muralSelectedElementIds.includes(data.id)) {
            muralSelectedElementIds = [data.id];
        }
        highlightMuralElements(muralSelectedElementIds);
        showMuralContextMenu(e.clientX, e.clientY, data.id);
    });

    // Long press for mobile
    let longPressTimer = null;
    div.addEventListener('touchstart', (e) => {
        longPressTimer = setTimeout(() => {
            const touch = e.touches[0];
            if (!muralSelectedElementIds.includes(data.id)) {
                muralSelectedElementIds = [data.id];
            }
            highlightMuralElements(muralSelectedElementIds);
            showMuralContextMenu(touch.clientX, touch.clientY, data.id);
        }, 300); // Reduced from 500ms
    }, { passive: true });
    div.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
    div.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });

    return div;
}

function highlightMuralElements(ids) {
    document.querySelectorAll('.mural-element.selected').forEach(el => el.classList.remove('selected'));
    (ids || []).forEach(id => {
        const dom = document.getElementById(`mural-el-${id}`);
        if (dom) dom.classList.add('selected');
    });
    // Connectors live in the SVG layer, not as .mural-element DOM nodes — re-render them
    // so any connectors in the selection (e.g. from a marquee) pick up the selected style.
    if (typeof renderAllMuralConnectors === 'function') renderAllMuralConnectors();
    updateSelectionBoundingBox();
    updateMuralArrangeBtn();
}

/* ═══════════════════════════════════════
   SELECTION BOUNDING BOX — Group drag & resize
   ═══════════════════════════════════════ */
// How many of the selected ids are real shapes (not connectors). The group bounding box
// only makes sense for 2+ shapes; a lone shape co-selected with its connectors must NOT
// get a group box (that was the second, larger boundary around a single shape).
function _muralSelectedShapeCount() {
    return (muralSelectedElementIds || []).reduce((n, id) => {
        const el = muralElements.find(e => String(e.id) === String(id));
        return n + (el && el.type !== 'connector' ? 1 : 0);
    }, 0);
}

function getSelectionBounds() {
    if (_muralSelectedShapeCount() < 2) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    muralSelectedElementIds.forEach(id => {
        const el = muralElements.find(e => String(e.id) === String(id));
        if (!el || el.type === 'connector') return;
        const ex = el.x || 0, ey = el.y || 0;
        const ew = el.w || 150, eh = el.h || 150;
        minX = Math.min(minX, ex);
        minY = Math.min(minY, ey);
        maxX = Math.max(maxX, ex + ew);
        maxY = Math.max(maxY, ey + eh);
    });
    if (minX === Infinity) return null;
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function updateSelectionBoundingBox() {
    let box = document.getElementById('muralSelectionBox');
    // Only show the group bounding box + corner handles for a MULTI-selection of SHAPES.
    // A single element already shows its own selection outline and resize handle, so an
    // extra box just stacks another (larger) boundary around it. Connectors in the
    // selection don't count — otherwise one shape + its connectors would trigger it.
    if (_muralSelectedShapeCount() < 2) {
        removeSelectionBoundingBox();
        return;
    }
    const bounds = getSelectionBounds();
    if (!bounds) {
        removeSelectionBoundingBox();
        return;
    }
    const canvas = document.getElementById('muralCanvas');
    if (!canvas) return;

    if (!box) {
        box = document.createElement('div');
        box.id = 'muralSelectionBox';
        box.className = 'mural-selection-box';
        canvas.appendChild(box);

        // Append handles as SIBLINGS on the canvas (not inside the box)
        // so pointer-events: none on the box doesn't block them on desktop
        ['nw','ne','sw','se'].forEach(edge => {
            const handle = document.createElement('div');
            handle.className = `mural-sel-handle ${edge}`;
            handle.id = `muralSelHandle-${edge}`;
            handle.dataset.edge = edge;
            handle.addEventListener('pointerdown', onSelBoxHandleDown);
            canvas.appendChild(handle);
        });
    }

    const pad = 8;
    const bx = bounds.x - pad, by = bounds.y - pad;
    const bw = bounds.w + pad * 2, bh = bounds.h + pad * 2;
    box.style.left = `${bx}px`;
    box.style.top = `${by}px`;
    box.style.width = `${bw}px`;
    box.style.height = `${bh}px`;

    // Position corner handles
    const hOff = 6; // half handle size
    const positions = {
        nw: { left: bx - hOff, top: by - hOff },
        ne: { left: bx + bw - hOff, top: by - hOff },
        sw: { left: bx - hOff, top: by + bh - hOff },
        se: { left: bx + bw - hOff, top: by + bh - hOff }
    };
    ['nw','ne','sw','se'].forEach(edge => {
        const h = document.getElementById(`muralSelHandle-${edge}`);
        if (h) {
            h.style.left = `${positions[edge].left}px`;
            h.style.top = `${positions[edge].top}px`;
        }
    });
}

function onSelBoxHandleDown(e) {
    e.stopPropagation();
    e.preventDefault();
    const edge = e.target.dataset.edge;
    if (!edge) return;
    snapshotElementsForUndo(muralSelectedElementIds, 'resize');
    muralGroupResizing = true;
    muralGroupResizeEdge = edge;
    const bounds = getSelectionBounds();
    // Snapshot each element's relative position within the bounding box
    const elemSnapshots = [];
    muralSelectedElementIds.forEach(id => {
        const el = muralElements.find(item => String(item.id) === String(id));
        if (!el || el.type === 'connector') return;
        elemSnapshots.push({
            id: el.id,
            rx: ((el.x || 0) - bounds.x) / bounds.w,
            ry: ((el.y || 0) - bounds.y) / bounds.h,
            rw: (el.w || 150) / bounds.w,
            rh: (el.h || 150) / bounds.h
        });
    });
    muralGroupResizeStart = {
        mouseX: e.clientX,
        mouseY: e.clientY,
        bounds: { ...bounds },
        elemSnapshots
    };
}

function onGroupResizeMove(e) {
    if (!muralGroupResizing) return;
    const { bounds, elemSnapshots } = muralGroupResizeStart;
    const dx = (e.clientX - muralGroupResizeStart.mouseX) / muralTransform.scale;
    const dy = (e.clientY - muralGroupResizeStart.mouseY) / muralTransform.scale;
    const edge = muralGroupResizeEdge;

    let newX = bounds.x, newY = bounds.y, newW = bounds.w, newH = bounds.h;
    if (edge.includes('e')) { newW = Math.max(60, bounds.w + dx); }
    if (edge.includes('w')) { newW = Math.max(60, bounds.w - dx); newX = bounds.x + bounds.w - newW; }
    if (edge.includes('s')) { newH = Math.max(60, bounds.h + dy); }
    if (edge.includes('n')) { newH = Math.max(60, bounds.h - dy); newY = bounds.y + bounds.h - newH; }

    // Apply proportional resize to all elements
    elemSnapshots.forEach(snap => {
        const el = muralElements.find(item => String(item.id) === String(snap.id));
        if (!el) return;
        el.x = newX + snap.rx * newW;
        el.y = newY + snap.ry * newH;
        el.w = Math.max(40, snap.rw * newW);
        el.h = Math.max(40, snap.rh * newH);
        const dom = document.getElementById(`mural-el-${el.id}`);
        if (dom) {
            dom.style.left = `${el.x}px`;
            dom.style.top = `${el.y}px`;
            dom.style.width = `${el.w}px`;
            dom.style.height = `${el.h}px`;
        }
        updateConnectorsForElement(el.id);
    });
    updateSelectionBoundingBox();
}

function onGroupResizeUp(e) {
    if (!muralGroupResizing) return;
    muralGroupResizing = false;
    muralGroupResizeEdge = null;
    // Elements already updated in-place, will be saved on manual sync
}

function removeSelectionBoundingBox() {
    const box = document.getElementById('muralSelectionBox');
    if (box) box.remove();
    // Remove sibling handles
    ['nw','ne','sw','se'].forEach(edge => {
        const h = document.getElementById(`muralSelHandle-${edge}`);
        if (h) h.remove();
    });
}

function updateSelectionBoundingBoxOffset(dx, dy) {
    // Temporarily offset the bounding box + handles during drag (before el.x/y are committed)
    const box = document.getElementById('muralSelectionBox');
    if (!box || muralSelectedElementIds.length < 2) return;
    const bounds = getSelectionBounds();
    if (!bounds) return;
    const pad = 8;
    const bx = bounds.x + dx - pad, by = bounds.y + dy - pad;
    const bw = bounds.w + pad * 2, bh = bounds.h + pad * 2;
    box.style.left = `${bx}px`;
    box.style.top = `${by}px`;
    // Move handles too
    const hOff = 6;
    const positions = {
        nw: { left: bx - hOff, top: by - hOff },
        ne: { left: bx + bw - hOff, top: by - hOff },
        sw: { left: bx - hOff, top: by + bh - hOff },
        se: { left: bx + bw - hOff, top: by + bh - hOff }
    };
    ['nw','ne','sw','se'].forEach(edge => {
        const h = document.getElementById(`muralSelHandle-${edge}`);
        if (h) {
            h.style.left = `${positions[edge].left}px`;
            h.style.top = `${positions[edge].top}px`;
        }
    });
}

function changeMuralColor(elementId, color) {
    const el = muralElements.find(item => String(item.id) === String(elementId));
    if (!el) return;
    snapshotElementsForUndo([elementId], 'color');
    el.color = color;
    const dom = document.getElementById(`mural-el-${elementId}`);
    if (dom) { if (el.type === 'drawing') _muralPaintDrawing(dom, el); else dom.style.backgroundColor = color; }
    // Removed autosave: saveMuralElement(el);
    dismissMuralPopups();
}
window.changeMuralColor = changeMuralColor;
window.dismissMuralPopups = dismissMuralPopups;

function dismissMuralPopups() {
    if (muralContextMenuEl) { muralContextMenuEl.remove(); muralContextMenuEl = null; }
    if (muralColorPickerEl) { muralColorPickerEl.remove(); muralColorPickerEl = null; }
    const shapeMenu = document.getElementById('muralShapeMenu');
    if (shapeMenu) shapeMenu.classList.remove('visible');
    const bgPanel = document.getElementById('muralBgPanel');
    if (bgPanel) bgPanel.remove();
    closeMuralArrangeMenu();
    closeMuralExportMenu();
}

/* ═══════════════════════════════════════
   SCRIBBLE / PEN TOOL
   Freehand strokes become their own 'drawing' elements: the stroke is
   stored as an SVG path (relative to the element box) in `content`, so a
   scribble moves, resizes, recolours, deletes, undoes and exports like
   any other item. The pen stays on until you pick another tool.
   ═══════════════════════════════════════ */
const MURAL_PEN_COLORS = ['#0F172A', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#6366F1', '#EC4899', '#FFFFFF'];
const MURAL_PEN_WIDTHS = [2, 4, 8, 14];
let muralPen = (() => {
    try { const v = JSON.parse(localStorage.getItem('os.mural.pen') || 'null'); if (v && v.color && v.width) return v; } catch (_) {}
    return { color: '#0F172A', width: 4 };
})();
let muralPenStroke = null; // { pts: [[x,y]...], pointerId, path }

function _muralSavePen() { try { localStorage.setItem('os.mural.pen', JSON.stringify(muralPen)); } catch (_) {} }

// Smooth path through points (quadratic curves via midpoints).
function _muralPenPath(pts) {
    if (!pts.length) return '';
    const f = n => Math.round(n * 10) / 10;
    if (pts.length < 3) {
        const [a, b] = [pts[0], pts[pts.length - 1]];
        return `M${f(a[0])} ${f(a[1])}L${f(b[0] + (a === b ? 0.1 : 0))} ${f(b[1])}`;
    }
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        d += `Q${f(pts[i][0])} ${f(pts[i][1])} ${f(mx)} ${f(my)}`;
    }
    const last = pts[pts.length - 1];
    return d + `L${f(last[0])} ${f(last[1])}`;
}

function _muralDrawingData(el) {
    try { const o = JSON.parse(el.content || '{}'); if (o && o.d) return o; } catch (_) {}
    return { d: '', vw: el.w || 1, vh: el.h || 1 };
}

// Render (or re-render) the stroke inside a drawing element.
function _muralPaintDrawing(dom, el) {
    const content = dom && dom.querySelector('.mural-element-content');
    if (!content) return;
    const o = _muralDrawingData(el);
    const sw = Number(el.stroke_width) || 4;
    const col = (el.color && el.color !== 'transparent') ? el.color : '#0F172A';
    content.innerHTML = `<svg class="mural-drawing-svg" viewBox="0 0 ${o.vw} ${o.vh}" preserveAspectRatio="none" width="100%" height="100%" overflow="visible">`
        + `<path class="mural-drawing-hit" d="${o.d}" fill="none" stroke="transparent" stroke-width="${Math.max(sw, 16)}" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<path d="${o.d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function _muralPenMenuHTML() {
    return `
        <div class="mural-pen-row">${MURAL_PEN_COLORS.map(c =>
            `<button class="mural-pen-sw ${c === muralPen.color ? 'on' : ''}" style="--c:${c}" title="${c}" onclick="setMuralPen('color','${c}')"></button>`).join('')}</div>
        <div class="mural-pen-row">${MURAL_PEN_WIDTHS.map(w =>
            `<button class="mural-pen-w ${w === muralPen.width ? 'on' : ''}" title="${w}px" onclick="setMuralPen('width',${w})"><span style="width:${Math.min(22, w + 4)}px;height:${w}px"></span></button>`).join('')}</div>
        <div class="mural-pen-hint">Draw on the board · V or Esc to stop</div>`;
}

function setMuralPen(prop, val) {
    muralPen[prop] = val;
    _muralSavePen();
    const m = document.getElementById('muralPenMenu');
    if (m) m.innerHTML = _muralPenMenuHTML();
    const dot = document.getElementById('muralPenDot');
    if (dot) dot.style.background = muralPen.color;
    // Also restyle selected scribbles, so you can recolour/re-weight after drawing.
    const sel = _muralSelectedEls().filter(el => el.type === 'drawing');
    if (sel.length) {
        snapshotElementsForUndo(sel.map(e => e.id), 'color');
        sel.forEach(el => {
            if (prop === 'color') el.color = val; else el.stroke_width = val;
            _muralPaintDrawing(document.getElementById('mural-el-' + el.id), el);
        });
        showSaveIndicator('saving');
    }
}
window.setMuralPen = setMuralPen;

function toggleMuralPen(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('muralPenMenu');
    if (muralActiveTool === 'pen') {
        // Second tap toggles the colour/width menu.
        if (menu) { const vis = menu.classList.contains('visible'); dismissMuralPopups(); if (!vis) { menu.innerHTML = _muralPenMenuHTML(); menu.classList.add('visible'); } }
        return;
    }
    dismissMuralPopups();
    setMuralTool('pen');
    if (menu) { menu.innerHTML = _muralPenMenuHTML(); menu.classList.add('visible'); }
}
window.toggleMuralPen = toggleMuralPen;

function _muralPenDown(e) {
    if (e.button && e.button !== 0) return false;
    e.preventDefault();
    const menu = document.getElementById('muralPenMenu');
    if (menu) menu.classList.remove('visible');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const canvas = document.getElementById('muralCanvas');
    const p = muralClientToWorld(e.clientX, e.clientY);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'mural-pen-live');
    svg.setAttribute('width', '10000'); svg.setAttribute('height', '10000');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', muralPen.color);
    path.setAttribute('stroke-width', muralPen.width);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    canvas.appendChild(svg);
    muralPenStroke = { pts: [[p.x, p.y]], pointerId: e.pointerId, svg, path };
    path.setAttribute('d', _muralPenPath(muralPenStroke.pts));
    const page = document.getElementById('muralPage');
    try { page && page.setPointerCapture && page.setPointerCapture(e.pointerId); } catch (_) {}
    return true;
}

function _muralPenMove(e) {
    const s = muralPenStroke;
    if (!s || e.pointerId !== s.pointerId) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const minGap = 1.2 / (muralTransform.scale || 1);
    (evs.length ? evs : [e]).forEach(ev => {
        const p = muralClientToWorld(ev.clientX, ev.clientY);
        const last = s.pts[s.pts.length - 1];
        if (Math.hypot(p.x - last[0], p.y - last[1]) >= minGap) s.pts.push([p.x, p.y]);
    });
    s.path.setAttribute('d', _muralPenPath(s.pts));
}

function _muralPenCancel() {
    if (!muralPenStroke) return;
    muralPenStroke.svg.remove();
    muralPenStroke = null;
}

function _muralPenUp() {
    const s = muralPenStroke;
    if (!s) return;
    muralPenStroke = null;
    s.svg.remove();
    const pts = s.pts;
    const sw = muralPen.width;
    const pad = sw / 2 + 2;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    pts.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    const w = Math.max(8, Math.ceil(x1 - x0)), h = Math.max(8, Math.ceil(y1 - y0));
    const rel = pts.map(([x, y]) => [x - x0, y - y0]);
    const newEl = {
        project_id: muralActiveProjectId,
        type: 'drawing',
        x: Math.round(x0), y: Math.round(y0), w, h,
        content: JSON.stringify({ v: 1, vw: w, vh: h, d: _muralPenPath(rel) }),
        color: muralPen.color,
        stroke_width: sw,
        z_index: muralElements.length + 1
    };
    const tempId = `temp_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    newEl.id = tempId;
    muralElements.push(newEl);
    const canvas = document.getElementById('muralCanvas');
    if (canvas) canvas.appendChild(createMuralElementDOM(newEl));
    pushMuralUndo({ action: 'create', snapshots: [{ ...newEl }] });
    showSaveIndicator('saving');
}

/* ═══════════════════════════════════════
   IMPORT — paste an outline (or JSON) and the board builds itself
   Outline format (one item per line):
     # Section title {yellow}        ← heading; braces set defaults for its items
     Pitchdeck {board}                ← item; {board} also makes it a sub-board
     One Pager
                                      ← blank line = new row
     Website {green}
     Pitchdeck -> One Pager           ← arrow between two items
   JSON format: { sections:[{title,color,shape,rows:[[item,…],…]}], links:[{from,to}] }
   where an item is "text" or { text, color, shape, bold, board:{…same format…} }.
   ═══════════════════════════════════════ */
const MURAL_IMPORT_COLORS = {
    yellow: '#E3D46F', green: '#A7D8B5', blue: '#A9BEDE', pink: '#DDB3CC', purple: '#CFC6DD',
    lilac: '#CFC6DD', orange: '#F3C48B', red: '#F2A7A7', gray: '#D9DCE1', grey: '#D9DCE1',
    teal: '#9ED9D6', white: '#FFFFFF', black: '#1F2937', none: 'transparent'
};
const MURAL_IMPORT_SHAPES = { rect: 'rect', box: 'rect', rectangle: 'rect', rounded: 'rounded', round: 'rounded',
    circle: 'circle', ellipse: 'ellipse', oval: 'ellipse', diamond: 'diamond', triangle: 'triangle', hexagon: 'hexagon',
    pentagon: 'pentagon', octagon: 'octagon', star: 'star', parallelogram: 'parallelogram',
    sticky: 'sticky', note: 'sticky', text: 'text' };

function _muralImpColor(v) {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    if (/^#[0-9a-f]{3,8}$/.test(s) || s.startsWith('rgb')) return v;
    return MURAL_IMPORT_COLORS[s] || null;
}

// "Pitchdeck {board, yellow}" → { text, opts }
function _muralImpParseMods(line) {
    const opts = {};
    const text = line.replace(/\{([^}]*)\}/g, (_, inner) => {
        inner.split(/[,\s]+/).filter(Boolean).forEach(tok => {
            const t = tok.toLowerCase();
            if (t === 'board' || t === 'subboard' || t === 'sub-board') opts.board = true;
            else if (t === 'bold') opts.bold = true;
            else if (MURAL_IMPORT_SHAPES[t]) opts.shape = MURAL_IMPORT_SHAPES[t];
            else if (_muralImpColor(t)) opts.color = _muralImpColor(t);
        });
        return '';
    }).trim();
    return { text, opts };
}

// Outline text → spec object
function _muralImpParseOutline(src) {
    const spec = { sections: [], links: [] };
    let sec = null, row = null;
    const ensureSec = () => { if (!sec) { sec = { title: '', rows: [] }; spec.sections.push(sec); } return sec; };
    String(src).replace(/\r/g, '').split('\n').forEach(raw => {
        const line = raw.trim();
        if (!line) { row = null; return; }
        if (/^(\/\/|;)/.test(line)) return;
        const arrow = line.match(/^(.+?)\s*(?:->|→|=>)\s*(.+)$/);
        if (arrow && !/^#/.test(line)) { spec.links.push({ from: arrow[1].replace(/^[-*•]\s*/, '').trim(), to: arrow[2].trim() }); return; }
        const h = line.match(/^#{1,3}\s*(.*)$/);
        if (h) {
            const { text, opts } = _muralImpParseMods(h[1]);
            sec = { title: text, color: opts.color, shape: opts.shape, rows: [] };
            spec.sections.push(sec); row = null; return;
        }
        const { text, opts } = _muralImpParseMods(line.replace(/^([-*•]|\d+[.)])\s+/, ''));
        if (!text) return;
        ensureSec();
        if (!row) { row = []; sec.rows.push(row); }
        row.push({ text, ...opts });
    });
    return spec;
}

function _muralImpSpec(src) {
    const t = String(src || '').trim();
    if (!t) return null;
    if (t[0] === '{' || t[0] === '[') {
        const j = JSON.parse(t);
        return Array.isArray(j) ? { sections: [{ title: '', rows: [j] }], links: [] } : j;
    }
    return _muralImpParseOutline(t);
}

function _muralImpCount(spec, acc = { items: 0, sections: 0, links: 0, boards: 0, attach: 0 }) {
    (spec.attach || []).forEach(a => { acc.attach++; if (a.board) _muralImpCount(a.board, acc); });
    (spec.sections || []).forEach(s => {
        if (s.title) acc.sections++;
        (s.items || []).forEach(() => acc.items++);
        (s.rows || []).forEach(r => (r || []).forEach(it => {
            acc.items++;
            if (it && typeof it === 'object' && (it.board)) { acc.boards++; if (typeof it.board === 'object') _muralImpCount(it.board, acc); }
        }));
    });
    acc.links += (spec.links || []).length;
    (spec.items || []).forEach(() => acc.items++);
    return acc;
}

// Spec → element objects laid out from (ox, oy). Returns { els, boardsToMake:[{el, spec}] }
function _muralImpLayout(spec, projectId, ox, oy) {
    const els = [], boards = [], byText = {};
    const uid = () => `temp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    let z = (muralElements.length || 0) + 1;
    const GAP_X = 20, GAP_Y = 16, SEC_GAP = 64;

    // Estimated card height for wrapped (and multi-line) text at a given width/size.
    const estH = (text, w, shape, size) => {
        const fs = Number(size) || 14, cw = fs * 0.54, lh = fs * 1.45;
        const perLine = Math.max(8, Math.floor((w - 32) / cw));
        const lines = String(text).split('\n').reduce((n, ln) => n + Math.max(1, Math.ceil(ln.length / perLine)), 0);
        const min = shape === 'sticky' ? 120 : 56;
        return Math.max(min, Math.ceil(lines * lh + 30));
    };
    const makeCard = (it, x, y, defaults) => {
        const text = String(it.text || it.title || '').trim();
        const shape = MURAL_IMPORT_SHAPES[String(it.shape || it.type || '').toLowerCase()] || defaults.shape || 'rect';
        const w = Number(it.w) || Number(defaults.w) || Math.max(150, Math.min(260, text.length * 8 + 44));
        const size = it.size || defaults.size;
        const h = Number(it.h) || estH(text, w, shape, size);
        const color = _muralImpColor(it.color) || defaults.color || (shape === 'text' ? 'transparent' : MURAL_IMPORT_COLORS.purple);
        const el = shape === 'sticky' ? { type: 'sticky' } : shape === 'text' ? { type: 'text' } : { type: 'shape', shape };
        Object.assign(el, { id: uid(), project_id: projectId, x, y, w, h, content: text, color, z_index: z++ });
        if (shape === 'rounded') el.border_radius = 14;
        if (it.bold || defaults.bold) el.bold = true;
        if (size) el.font_size = Number(size);
        const align = it.align || defaults.align;
        if (align) el.text_align = align;
        if (it.textColor || defaults.textColor) el.text_color = it.textColor || defaults.textColor;
        els.push(el);
        const key = text.toLowerCase();
        if (key && !byText[key]) byText[key] = el;
        if (it.id) byText['#' + String(it.id).toLowerCase()] = el;
        if (it.board) boards.push({ el, spec: typeof it.board === 'object' ? it.board : null });
        return el;
    };
    const heading = (title, x, y, opt = {}) => {
        const size = opt.size || 22;
        const el = { id: uid(), project_id: projectId, type: 'text', x, y, w: opt.w || Math.max(240, title.length * size * 0.6 + 40), h: Math.ceil(size * 1.8),
            content: title, color: 'transparent', font_size: size, bold: true, z_index: z++ };
        if (opt.textColor) el.text_color = opt.textColor;
        els.push(el);
        return el;
    };
    const flowLinks = [];
    const secDefaults = (sec) => ({
        color: _muralImpColor(sec.color),
        shape: MURAL_IMPORT_SHAPES[String(sec.shape || '').toLowerCase()] || sec.shape,
        w: sec.w, size: sec.size, align: sec.align, bold: sec.bold, textColor: sec.textColor
    });

    let y = oy;
    // Optional board title + subtitle on top
    if (spec.title) { heading(String(spec.title), ox, y, { size: 30 }); y += 60; }
    if (spec.subtitle) {
        const sub = makeCard({ text: String(spec.subtitle), shape: 'text', align: 'left', size: 15 }, ox, y, { w: 900, color: 'transparent' });
        y += sub.h + 16;
    }

    if (spec.kanban) {
        // Sections become columns of cards; every `band` columns start a new band below.
        const band = Number(spec.band) || 5, colGap = 36;
        const secs = spec.sections || [];
        for (let b = 0; b < secs.length; b += band) {
            let x = ox, bandBottom = y;
            secs.slice(b, b + band).forEach(sec => {
                const d = secDefaults(sec);
                const cw = Number(sec.w) || Number(spec.colWidth) || 300;
                d.w = cw;
                let cy = y;
                if (sec.title) {
                    const hdr = makeCard({ text: sec.title, bold: true, size: 16, align: 'left' }, x, cy, { w: cw, color: _muralImpColor(sec.headColor) || _muralImpColor(spec.headColor) || '#1F2937', textColor: '#FFFFFF' });
                    hdr.h = 46; cy += 46 + 10;
                }
                const items = [];
                (sec.rows || []).forEach(r => (r || []).forEach(it => items.push(typeof it === 'string' ? { text: it } : (it || {}))));
                (sec.items || []).forEach(it => items.push(typeof it === 'string' ? { text: it } : it));
                let prev = null;
                items.forEach(it => {
                    const el = makeCard(it, x, cy, d);
                    if (sec.flow && prev) flowLinks.push([prev, el, sec.flowColor]);
                    prev = el;
                    cy += el.h + (sec.flow ? 26 : 10);
                });
                bandBottom = Math.max(bandBottom, cy);
                x += cw + colGap;
            });
            y = bandBottom + SEC_GAP;
        }
    } else {
        (spec.sections || []).forEach(sec => {
            if (sec.title) { heading(sec.title, ox, y); y += 52; }
            const d = secDefaults(sec);
            const perRow = Number(sec.perRow) || 8;
            let prev = null;
            (sec.rows || []).forEach(rowIn => {
                const row = (rowIn || []).map(it => typeof it === 'string' ? { text: it } : (it || {}));
                for (let i = 0; i < row.length; i += perRow) {
                    let x = ox, rowH = 0;
                    row.slice(i, i + perRow).forEach(it => {
                        const el = makeCard(it, x, y, d);
                        if (sec.flow && prev) flowLinks.push([prev, el, sec.flowColor]);
                        prev = el;
                        x += el.w + (sec.flow ? 40 : GAP_X); rowH = Math.max(rowH, el.h);
                    });
                    y += rowH + GAP_Y;
                }
            });
            y += SEC_GAP - GAP_Y;
        });
    }
    // Free-placed items (explicit x/y relative to the import origin)
    (spec.items || []).forEach(it => makeCard(it, ox + (Number(it.x) || 0), oy + (Number(it.y) || 0), { w: it.w || 170 }));

    const mkConn = (a, b, color, label) => els.push({ id: uid(), project_id: projectId, type: 'connector', from_id: a.id, to_id: b.id, from_side: null, to_side: null,
        color: _muralImpColor(color) || '#6366F1', connector_style: 'bezier', x: 0, y: 0, w: 0, h: 0, content: label || '', z_index: 0 });
    flowLinks.forEach(([a, b, c]) => mkConn(a, b, c));
    // Arrows — match by item text (or "#id"), also against items already on this board
    const existing = projectId === muralActiveProjectId ? muralElements : [];
    const find = (k) => {
        const key = String(k || '').trim().toLowerCase();
        return byText[key] || byText['#' + key] || existing.find(e => e.type !== 'connector' && _muralElText(e).toLowerCase() === key) || null;
    };
    let missing = 0;
    (spec.links || []).forEach(l => {
        const a = find(l.from), b = find(l.to);
        if (!a || !b || a === b) { missing++; return; }
        mkConn(a, b, l.color, l.label);
    });
    return { els, boards, missing };
}

/* Attach mode: { attach: [ { match:"Pitchdeck" | ["Content","Contnent"], row:"Decks" | "top", board:{…} } ] }
   Fills the sub-board of an item that is ALREADY on this board (replacing what's inside),
   creating the sub-board first if the item doesn't have one yet. */
function _muralNorm(t) { return String(t || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

function _muralFindForAttach(entry) {
    const names = (Array.isArray(entry.match) ? entry.match : [entry.match]).map(_muralNorm).filter(Boolean);
    const shapes = muralElements.filter(e => e.type !== 'connector' && e.type !== 'drawing');
    const geo = e => { const d = document.getElementById('mural-el-' + e.id);
        return d ? { x: d.offsetLeft, y: d.offsetTop, h: d.offsetHeight } : { x: e.x || 0, y: e.y || 0, h: e.h || 60 }; };
    let cands = shapes.filter(e => names.includes(_muralNorm(_muralElText(e))));
    if (!cands.length) return null;
    const row = entry.row;
    if (row === 'top') return cands.sort((a, b) => geo(a).y - geo(b).y)[0];
    if (row) {
        const hdr = shapes.filter(e => _muralNorm(_muralElText(e)) === _muralNorm(row)).sort((a, b) => geo(a).x - geo(b).x)[0];
        if (hdr) {
            const hg = geo(hdr), hc = hg.y + hg.h / 2;
            const inRow = cands.filter(e => e !== hdr && Math.abs((geo(e).y + geo(e).h / 2) - hc) < Math.max(30, hg.h / 2 + 8));
            if (inRow.length) return inRow.sort((a, b) => geo(a).x - geo(b).x)[0];
        }
        return null;
    }
    return cands.sort((a, b) => geo(a).y - geo(b).y || geo(a).x - geo(b).x)[0];
}

async function _muralRunAttach(spec, statusCb) {
    const list = spec.attach || [];
    let done = 0, notFound = [];
    for (const entry of list) {
        const el = _muralFindForAttach(entry);
        if (!el) { notFound.push(Array.isArray(entry.match) ? entry.match[0] : entry.match); continue; }
        let pid = el.link_project_id && muralProjects.some(p => String(p.id) === String(el.link_project_id)) ? String(el.link_project_id) : null;
        const title = entry.title || (entry.board && entry.board.title) || _muralElText(el) || 'Board';
        if (!pid) {
            const parent = muralProjects.find(p => String(p.id) === String(muralActiveProjectId));
            const res = await apiPost({ action: 'create', sheet: 'mural_projects', payload: {
                title: title.slice(0, 120), category: (parent && parent.category) || 'Uncategorized', parent_id: String(muralActiveProjectId),
                created_at: new Date().toISOString(), updated_at: new Date().toISOString() } });
            pid = res && (res.id || (res.data && res.data.id)) ? String(res.id || res.data.id) : null;
            if (!pid) { notFound.push(title + ' (could not create board)'); continue; }
            muralProjects.push(res.data || { id: pid, title, parent_id: String(muralActiveProjectId) });
            el.link_project_id = pid;
            const old = document.getElementById('mural-el-' + el.id);
            if (old) old.replaceWith(createMuralElementDOM(el));
        }
        const inner = _muralImpLayout(entry.board || {}, pid, 100, 100);
        await _muralImpMakeBoards(inner.boards, pid);
        const r = await apiPost({ action: 'syncMuralElements', sheet: 'mural_elements', payload: { project_id: pid, elements: inner.els } });
        if (r && r.success === false) { notFound.push(title + ' (save failed)'); continue; }
        done++;
        if (statusCb) statusCb(done, list.length);
    }
    state.data.mural_projects = muralProjects;
    return { done, notFound };
}

function _muralImpPreview() {
    const ta = document.getElementById('muralImpText');
    const st = document.getElementById('muralImpStatus');
    const go = document.getElementById('muralImpGo');
    if (!ta || !st) return;
    try { localStorage.setItem('os.mural.importDraft', ta.value); } catch (_) {}
    let spec = null, err = '';
    try { spec = _muralImpSpec(ta.value); } catch (e) { err = 'That JSON has an error — check brackets and commas.'; }
    if (!spec) { st.textContent = err || 'Nothing to import yet'; st.classList.toggle('bad', !!err); if (go) go.disabled = true; return; }
    const c = _muralImpCount(spec);
    const parts = [`${c.items} item${c.items === 1 ? '' : 's'}`];
    if (c.sections) parts.push(`${c.sections} section${c.sections === 1 ? '' : 's'}`);
    if (c.links) parts.push(`${c.links} arrow${c.links === 1 ? '' : 's'}`);
    if (c.boards) parts.push(`${c.boards} sub-board${c.boards === 1 ? '' : 's'}`);
    if (spec.muralBoardExport) {
        st.textContent = `Board file: “${spec.title || 'Board'}” — ${(spec.projects || []).length} boards · ${(spec.elements || []).length} items`;
        st.classList.remove('bad'); if (go) go.disabled = false; return;
    }
    if (c.attach) {
        st.textContent = `Will fill ${c.attach} workflow board${c.attach === 1 ? '' : 's'} on existing items (${c.items} cards in total)`;
        st.classList.remove('bad');
        if (go) go.disabled = false;
        return;
    }
    st.textContent = c.items ? 'Will add ' + parts.join(' · ') : 'Nothing to import yet';
    st.classList.remove('bad');
    if (go) go.disabled = !c.items;
}

async function _muralImpMakeBoards(boards, parentId) {
    for (const { el, spec } of boards) {
        const parent = muralProjects.find(p => String(p.id) === String(parentId));
        const title = (el.content || 'Board').slice(0, 120);
        const res = await apiPost({ action: 'create', sheet: 'mural_projects', payload: {
            title, category: (parent && parent.category) || 'Uncategorized', parent_id: String(parentId),
            created_at: new Date().toISOString(), updated_at: new Date().toISOString() } });
        const newId = res && (res.id || (res.data && res.data.id));
        if (!newId) continue;
        muralProjects.push(res.data || { id: newId, title, parent_id: String(parentId) });
        el.link_project_id = String(newId);
        if (spec) {
            const inner = _muralImpLayout(spec, String(newId), 100, 100);
            await _muralImpMakeBoards(inner.boards, newId);
            await apiPost({ action: 'syncMuralElements', sheet: 'mural_elements', payload: { project_id: String(newId), elements: inner.els } });
        }
    }
    state.data.mural_projects = muralProjects;
}

async function muralRunImport() {
    const ta = document.getElementById('muralImpText');
    const go = document.getElementById('muralImpGo');
    let spec;
    try { spec = _muralImpSpec(ta ? ta.value : ''); } catch (_) { toast('That JSON has an error'); return; }
    if (!spec) return;
    if (spec.muralBoardExport) {
        if (go) { go.disabled = true; go.textContent = 'Importing…'; }
        try {
            const r = await _muralImportBoardData(spec);
            document.getElementById('universalModal').classList.add('hidden');
            toast(`Imported “${r.title}” — ${r.boards} boards · ${r.items} items (find it on the Projects page)`);
        } catch (err) { toast('Import failed: ' + ((err && err.message) || 'unknown error')); }
        finally { if (go) { go.disabled = false; go.textContent = 'Import'; } }
        return;
    }
    if (go) { go.disabled = true; go.textContent = 'Importing…'; }
    if (spec.attach) {
        try {
            const st = document.getElementById('muralImpStatus');
            const { done, notFound } = await _muralRunAttach(spec, (d, n) => { if (st) st.textContent = `Building workflow boards… ${d} / ${n}`; });
            await manualMuralSync(); // save the new links on this board
            highlightMuralElements(muralSelectedElementIds);
            // Check the links really saved (needs the link_project_id column in the database).
            try {
                const fresh = await apiGet('mural_elements');
                const linkedHere = muralElements.filter(e => e.link_project_id).map(e => String(e.id));
                const savedOk = (fresh || []).some(r => linkedHere.includes(String(r.id)) && r.link_project_id);
                if (linkedHere.length && !savedOk) {
                    alert('The workflow boards were created, but the links could not be saved because the database is missing the new column.\n\nRun this once in Supabase → SQL editor, then — without reloading this page — press Save on the board (it re-saves the links to the boards just created):\n\nalter table public.mural_elements add column if not exists link_project_id text;\nalter table public.mural_projects add column if not exists parent_id text;');
                }
            } catch (_) {}
            if (notFound.length) {
                if (st) { st.textContent = `Filled ${done}. Not matched: ${notFound.join(', ')}`; st.classList.add('bad'); }
            } else {
                document.getElementById('universalModal').classList.add('hidden');
                try { localStorage.removeItem('os.mural.importDraft'); } catch (_) {}
            }
            toast(`Filled ${done} workflow board${done === 1 ? '' : 's'} — tap ↗ on an item to open it`);
        } catch (err) {
            console.error('Mural attach import failed', err);
            toast('Import stopped part-way — paste again to finish (it fills the rest)');
        } finally {
            if (go) { go.disabled = false; go.textContent = 'Import'; }
        }
        return;
    }
    try {
        // Place below the current content, lined up with its left edge.
        const shapes = muralElements.filter(e => e.type !== 'connector');
        let ox = 100, oy = 100;
        if (shapes.length) {
            // Use where items actually sit on screen (DOM), falling back to stored values.
            const box = e => { const d = document.getElementById('mural-el-' + e.id);
                return d ? { x: d.offsetLeft, b: d.offsetTop + d.offsetHeight } : { x: e.x || 0, b: (e.y || 0) + (e.h || 150) }; };
            ox = Math.min(...shapes.map(e => box(e).x));
            oy = Math.max(...shapes.map(e => box(e).b)) + 100;
        }
        const { els, boards, missing } = _muralImpLayout(spec, muralActiveProjectId, ox, oy);
        if (!els.length) { toast('Nothing to import'); return; }
        await _muralImpMakeBoards(boards, muralActiveProjectId);
        const canvas = document.getElementById('muralCanvas');
        els.forEach(el => {
            muralElements.push(el);
            if (el.type === 'connector') muralConnectors.push(el);
            else if (canvas) canvas.appendChild(createMuralElementDOM(el));
        });
        renderAllMuralConnectors();
        pushMuralUndo({ action: 'create', snapshots: els.map(e => ({ ...e })) });
        muralSelectedElementIds = els.filter(e => e.type !== 'connector').map(e => e.id);
        highlightMuralElements(muralSelectedElementIds);
        // Bring the new block into view.
        const s = muralTransform.scale;
        muralTransform.x = 80 - ox * s;
        muralTransform.y = 90 - oy * s;
        applyMuralTransform();
        document.getElementById('universalModal').classList.add('hidden');
        try { localStorage.removeItem('os.mural.importDraft'); } catch (_) {}
        await manualMuralSync();
        const n = els.filter(e => e.type !== 'connector').length;
        toast(`Imported ${n} item${n === 1 ? '' : 's'}${missing ? ` · ${missing} arrow${missing === 1 ? '' : 's'} skipped (item not found)` : ''}`);
    } catch (err) {
        console.error('Mural import failed', err);
        toast('Import failed — nothing was lost, try again');
    } finally {
        if (go) { go.disabled = false; go.textContent = 'Import'; }
    }
}
window.muralRunImport = muralRunImport;

/* ═══════════════════════════════════════
   BOARD FILE — move a board (with every sub-board inside it) to another Mural
   Export: one .json with the boards + all their items, ids kept so links survive.
   Import: "Import board file" on the Projects page (works in the team Mural).
   ═══════════════════════════════════════ */
async function muralExportBoardFile() {
    closeMuralExportMenu();
    const rootId = muralActiveProjectId;
    if (!rootId) return;
    try {
        toast('Preparing board file…');
        if (typeof manualMuralSync === 'function') { try { await manualMuralSync(); } catch (_) {} }
        const ids = _muralBoardFamily(rootId);
        const idSet = new Set(ids.map(String));
        const strip = (o) => { const c = { ...o }; delete c.user_id; return c; };
        const projects = muralProjects.filter(p => idSet.has(String(p.id))).map(p => {
            const c = strip(p);
            if (String(c.id) === String(rootId)) c.parent_id = null; // becomes a top-level board on import
            return c;
        });
        const all = await apiGet('mural_elements');
        const elements = (all || []).filter(e => idSet.has(String(e.project_id))).map(strip);
        const root = projects.find(p => String(p.id) === String(rootId));
        const data = { muralBoardExport: 1, exported_at: new Date().toISOString(), root: String(rootId),
            title: (root && root.title) || 'Board', projects, elements };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        await _muralDeliver(blob, _muralExportName('json').replace(/\.json$/, ' (board file).json'));
        toast(`Exported ${projects.length} board${projects.length === 1 ? '' : 's'} · ${elements.length} items`);
    } catch (err) {
        console.error('Board file export failed', err);
        toast('Could not export the board file');
    }
}
window.muralExportBoardFile = muralExportBoardFile;

async function _muralImportBoardData(data) {
    if (!data || !data.muralBoardExport || !Array.isArray(data.projects)) throw new Error('Not a Mural board file');
    const res = await apiPost({ action: 'importBoards', payload: { projects: data.projects, elements: data.elements || [] } });
    if (!res || res.success === false) throw new Error((res && res.message) || 'Import failed');
    await loadMuralDashboardData();
    return { boards: data.projects.length, items: (data.elements || []).length, title: data.title };
}

/* ═══════════════════════════════════════
   EXPORT — PNG image / PDF / PowerPoint
   The board (or just the selection) is rendered to a canvas with
   html-to-image, then saved directly or wrapped by jsPDF / PptxGenJS.
   Libraries load on first use only.
   ═══════════════════════════════════════ */
const MURAL_EXPORT_LIBS = {
    img:  'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js',
    pdf:  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    pptx: 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'
};
const _muralLibPromises = {};
function _muralLoadLib(key) {
    if (!_muralLibPromises[key]) {
        _muralLibPromises[key] = new Promise((resolve, reject) => {
            const sc = document.createElement('script');
            sc.src = MURAL_EXPORT_LIBS[key];
            sc.onload = resolve;
            sc.onerror = () => { delete _muralLibPromises[key]; reject(new Error('Could not load ' + key)); };
            document.head.appendChild(sc);
        });
    }
    return _muralLibPromises[key];
}

function _muralConnInSel(connId, selIds) {
    if (selIds.has(String(connId))) return true;
    const c = muralElements.find(x => String(x.id) === String(connId));
    return !!(c && c.from_id && c.to_id && selIds.has(String(c.from_id)) && selIds.has(String(c.to_id)));
}

// World-space box around what we export (elements + connector paths), with a margin.
function _muralExportBounds(onlySel) {
    const selIds = new Set(muralSelectedElementIds.map(String));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const grow = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
    document.querySelectorAll('#muralCanvas .mural-element').forEach(dom => {
        const id = dom.id.replace('mural-el-', '');
        if (onlySel && !selIds.has(id)) return;
        grow(dom.offsetLeft, dom.offsetTop, dom.offsetLeft + dom.offsetWidth, dom.offsetTop + dom.offsetHeight);
    });
    document.querySelectorAll('#muralConnectorSvg [data-connector-id]').forEach(path => {
        if (onlySel && !_muralConnInSel(path.getAttribute('data-connector-id'), selIds)) return;
        try { const b = path.getBBox(); if (b.width || b.height) grow(b.x, b.y, b.x + b.width, b.y + b.height); } catch (_) {}
    });
    if (!isFinite(x0)) return null;
    const pad = 48;
    return { x: Math.floor(x0 - pad), y: Math.floor(y0 - pad), w: Math.ceil(x1 - x0 + pad * 2), h: Math.ceil(y1 - y0 + pad * 2) };
}

async function _muralRenderToCanvas(onlySel) {
    await _muralLoadLib('img');
    const canvasEl = document.getElementById('muralCanvas');
    const page = document.getElementById('muralPage');
    if (!canvasEl || !window.htmlToImage) throw new Error('Renderer not ready');
    const box = _muralExportBounds(onlySel);
    if (!box) throw new Error('empty');
    const selIds = new Set(muralSelectedElementIds.map(String));
    // Stay under browser canvas limits (Safari ≈ 16.7M px).
    const ratio = Math.max(0.5, Math.min(2.5, Math.sqrt(16e6 / (box.w * box.h))));
    let bg = getComputedStyle(page).backgroundColor;
    if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') bg = '#ffffff';
    // Hide selection chrome while capturing.
    const selected = [...document.querySelectorAll('#muralCanvas .mural-element.selected')];
    selected.forEach(n => n.classList.remove('selected'));
    const keepOut = ['mural-el-board-link', 'mural-selection-box', 'mural-sel-handle', 'mural-resize-handle', 'mural-anchor', 'mural-marquee'];
    try {
        const opts = {
            width: box.w, height: box.h, pixelRatio: ratio, backgroundColor: bg, cacheBust: true,
            style: { transform: `translate(${-box.x}px, ${-box.y}px)`, left: '0px', top: '0px', cursor: 'default', willChange: 'auto' },
            filter: (n) => {
                if (!n || !n.getAttribute) return true;
                if (n.getAttribute('data-connector-hit')) return false;
                const cid = n.getAttribute('data-connector-id');
                if (cid && onlySel) return _muralConnInSel(cid, selIds);
                const cl = n.classList;
                if (cl && keepOut.some(k => cl.contains(k))) return false;
                if (onlySel && cl && cl.contains('mural-element')) return selIds.has(n.id.replace('mural-el-', ''));
                return true;
            }
        };
        // Safari sometimes paints fonts/images only on the second pass.
        if (/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) { try { await htmlToImage.toCanvas(canvasEl, opts); } catch (_) {} }
        const out = await htmlToImage.toCanvas(canvasEl, opts);
        return { canvas: out, box, bg };
    } finally {
        selected.forEach(n => n.classList.add('selected'));
    }
}

function _muralExportName(ext) {
    const p = muralProjects.find(q => String(q.id) === String(muralActiveProjectId));
    const base = ((p && p.title) || 'Mural').replace(/[\\/:*?"<>|]+/g, '').trim() || 'Mural';
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    return `${base} ${stamp}.${ext}`;
}

async function _muralDeliver(blob, name) {
    // Phones / home-screen apps: hand the file to the share sheet (Save to Files, AirDrop…)
    const touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
    if (touch && navigator.canShare) {
        try {
            const file = new File([blob], name, { type: blob.type });
            if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
        } catch (err) { if (err && err.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function _muralCssToHex(c) {
    const m = String(c || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) return [m[1], m[2], m[3]].map(v => Number(v).toString(16).padStart(2, '0')).join('').toUpperCase();
    const h = String(c || '').match(/^#([0-9a-f]{6})$/i);
    return h ? h[1].toUpperCase() : null;
}

async function muralExport(kind) {
    closeMuralExportMenu();
    const onlySel = window._muralExportScope === 'sel' && _muralArrangeItems().length > 0;
    if (!muralElements.length) { toast('Nothing on the board to export yet'); return; }
    const btn = document.getElementById('muralExportBtn');
    if (btn) btn.classList.add('busy');
    toast(kind === 'png' ? 'Preparing image…' : kind === 'pdf' ? 'Preparing PDF…' : 'Preparing PowerPoint…');
    try {
        const { canvas, box, bg } = await _muralRenderToCanvas(onlySel);
        if (kind === 'png') {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            await _muralDeliver(blob, _muralExportName('png'));
        } else if (kind === 'pdf') {
            await _muralLoadLib('pdf');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: box.w >= box.h ? 'landscape' : 'portrait', unit: 'pt', format: [box.w, box.h], compress: true });
            doc.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, box.w, box.h);
            await _muralDeliver(doc.output('blob'), _muralExportName('pdf'));
        } else if (kind === 'pptx') {
            await _muralLoadLib('pptx');
            const pptx = new window.PptxGenJS();
            pptx.layout = 'LAYOUT_WIDE'; // 13.33 × 7.5 in
            const p = muralProjects.find(q => String(q.id) === String(muralActiveProjectId));
            pptx.title = (p && p.title) || 'Mural';
            const slide = pptx.addSlide();
            const hex = _muralCssToHex(bg);
            if (hex) slide.background = { color: hex };
            const SW = 13.333, SH = 7.5, M = 0.25;
            const k = Math.min((SW - 2 * M) / box.w, (SH - 2 * M) / box.h);
            const w = box.w * k, h = box.h * k;
            slide.addImage({ data: canvas.toDataURL('image/png'), x: (SW - w) / 2, y: (SH - h) / 2, w, h });
            const out = await pptx.write({ outputType: 'blob' });
            const blob = out instanceof Blob ? out : new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
            await _muralDeliver(blob, _muralExportName('pptx'));
        }
    } catch (err) {
        console.error('Mural export failed', err);
        toast(err && err.message === 'empty' ? 'Nothing to export' : 'Export failed — check your connection and try again');
    } finally {
        if (btn) btn.classList.remove('busy');
    }
}
window.muralExport = muralExport;

/* ═══════════════════════════════════════
   SUB-BOARDS — turn an element into its own mural
   The element keeps link_project_id; the new board keeps parent_id, so its
   back button returns to the board it came from.
   ═══════════════════════════════════════ */
function _muralParentOf(project) {
    if (!project || !project.parent_id) return null;
    return muralProjects.find(p => String(p.id) === String(project.parent_id)) || null;
}

function _muralElText(el) {
    const tmp = document.createElement('div');
    tmp.innerHTML = String(el.content || '');
    return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
}

async function muralTurnIntoBoard(elementId) {
    const el = muralElements.find(e => String(e.id) === String(elementId));
    if (!el) return;
    if (el.link_project_id) return muralOpenLinkedBoard(elementId);
    const parent = muralProjects.find(p => String(p.id) === String(muralActiveProjectId));
    let title = _muralElText(el);
    if (!title) {
        title = (prompt('Name for the new board:', '') || '').trim();
        if (!title) return;
    }
    try {
        const res = await apiPost({ action: 'create', sheet: 'mural_projects', payload: {
            title: title.slice(0, 120),
            category: (parent && parent.category) || 'Uncategorized',
            parent_id: String(muralActiveProjectId),
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        } });
        const newId = res && (res.id || (res.data && res.data.id));
        if (!newId) throw new Error('No id returned');
        muralProjects.push(res.data || { id: newId, title, parent_id: String(muralActiveProjectId) });
        state.data.mural_projects = muralProjects;
        el.link_project_id = String(newId);
        const old = document.getElementById(`mural-el-${el.id}`);
        if (old) old.replaceWith(createMuralElementDOM(el));
        highlightMuralElements(muralSelectedElementIds);
        await manualMuralSync(); // persist the link right away
        toast(`“${title}” is now a board — tap ↗ on it to open`);
    } catch (err) {
        console.error(err);
        toast('Could not create the board');
    }
}
window.muralTurnIntoBoard = muralTurnIntoBoard;

async function muralOpenLinkedBoard(elementId) {
    const el = muralElements.find(e => String(e.id) === String(elementId));
    if (!el || !el.link_project_id) return;
    const target = muralProjects.find(p => String(p.id) === String(el.link_project_id));
    if (!target) { toast('That board no longer exists'); return; }
    try { await manualMuralSync(); } catch (_) {} // don't lose edits on this board
    dismissMuralPopups();
    hideMuralAppChrome(false);
    openMuralProject(target.id);
}
window.muralOpenLinkedBoard = muralOpenLinkedBoard;

function muralUnlinkBoard(elementId) {
    const el = muralElements.find(e => String(e.id) === String(elementId));
    if (!el || !el.link_project_id) return;
    _muralReleaseSubBoard(el.link_project_id);
    el.link_project_id = null;
    const old = document.getElementById(`mural-el-${el.id}`);
    if (old) old.replaceWith(createMuralElementDOM(el));
    highlightMuralElements(muralSelectedElementIds);
    manualMuralSync();
    toast('Unlinked — the board is now in your Projects list');
}
window.muralUnlinkBoard = muralUnlinkBoard;

// A sub-board whose element is gone goes back to the main Projects list.
function _muralReleaseSubBoard(projectId) {
    const p = muralProjects.find(q => String(q.id) === String(projectId));
    if (!p) return;
    p.parent_id = null;
    apiPost({ action: 'update', sheet: 'mural_projects', id: p.id, payload: { parent_id: null } }).catch(() => {});
}

function muralGoBack() {
    const project = muralProjects.find(p => String(p.id) === String(muralActiveProjectId));
    const parent = _muralParentOf(project);
    if (!parent) return exitMuralProject();
    dismissMuralPopups();
    closeMuralArrangeMenu();
    muralSpacePan = null;
    hideMuralAppChrome(false);
    openMuralProject(parent.id);
}
window.muralGoBack = muralGoBack;

const MURAL_ARR_GAP = 24;

function muralArrange(mode) {
    const items = _muralArrangeItems();
    if (items.length < 2) return;
    if ((mode === 'disth' || mode === 'distv' || mode === 'grid') && items.length < 3) return;
    snapshotElementsForUndo(items.map(i => i.el.id), 'move');

    const minX = Math.min(...items.map(i => i.x));
    const minY = Math.min(...items.map(i => i.y));
    const maxX = Math.max(...items.map(i => i.x + i.w));
    const maxY = Math.max(...items.map(i => i.y + i.h));
    const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

    if (mode === 'left') items.forEach(i => { i.x = minX; });
    else if (mode === 'hcenter') items.forEach(i => { i.x = midX - i.w / 2; });
    else if (mode === 'right') items.forEach(i => { i.x = maxX - i.w; });
    else if (mode === 'top') items.forEach(i => { i.y = minY; });
    else if (mode === 'vmiddle') items.forEach(i => { i.y = midY - i.h / 2; });
    else if (mode === 'bottom') items.forEach(i => { i.y = maxY - i.h; });
    else if (mode === 'disth') {
        const s = [...items].sort((a, b) => a.x - b.x);
        const gap = ((maxX - minX) - s.reduce((t, i) => t + i.w, 0)) / (s.length - 1);
        let x = minX; s.forEach(i => { i.x = x; x += i.w + gap; });
    } else if (mode === 'distv') {
        const s = [...items].sort((a, b) => a.y - b.y);
        const gap = ((maxY - minY) - s.reduce((t, i) => t + i.h, 0)) / (s.length - 1);
        let y = minY; s.forEach(i => { i.y = y; y += i.h + gap; });
    } else if (mode === 'row') {
        // Side by side, left → right in their current order, tops aligned.
        const s = [...items].sort((a, b) => (a.x - b.x) || (a.y - b.y));
        let x = minX; s.forEach(i => { i.x = x; i.y = minY; x += i.w + MURAL_ARR_GAP; });
    } else if (mode === 'col') {
        // Stacked, top → bottom in their current order, left edges aligned.
        const s = [...items].sort((a, b) => (a.y - b.y) || (a.x - b.x));
        let y = minY; s.forEach(i => { i.y = y; i.x = minX; y += i.h + MURAL_ARR_GAP; });
    } else if (mode === 'grid') {
        // Reading order (rows by y, then x), packed into a near-square grid.
        const s = [...items].sort((a, b) => (Math.abs(a.y - b.y) > 40 ? a.y - b.y : a.x - b.x));
        const cols = Math.ceil(Math.sqrt(s.length));
        const cw = Math.max(...s.map(i => i.w)), rows = Math.ceil(s.length / cols);
        const rh = [];
        for (let r = 0; r < rows; r++) rh.push(Math.max(...s.slice(r * cols, r * cols + cols).map(i => i.h)));
        s.forEach((i, k) => {
            const r = Math.floor(k / cols), c = k % cols;
            i.x = minX + c * (cw + MURAL_ARR_GAP);
            i.y = minY + rh.slice(0, r).reduce((t, h) => t + h + MURAL_ARR_GAP, 0);
        });
    }

    items.forEach(i => {
        i.el.x = Math.round(i.x);
        i.el.y = Math.round(i.y);
        if (i.dom) {
            i.dom.style.transition = 'left .22s ease, top .22s ease';
            i.dom.style.left = i.el.x + 'px';
            i.dom.style.top = i.el.y + 'px';
            setTimeout(() => { if (i.dom) i.dom.style.transition = ''; updateConnectorsForElement(i.el.id); updateSelectionBoundingBox(); }, 240);
        }
        updateConnectorsForElement(i.el.id);
    });
    updateSelectionBoundingBox();
    showSaveIndicator('saving');
    closeMuralArrangeMenu();
}

    const panel = document.getElementById('muralBgPanel');
    if (panel) { panel.remove(); toggleMuralBgPanel({ stopPropagation: () => {} }); }
    saveMuralBgSettings();
}

function applyMuralBackground() {
    const page = document.getElementById('muralPage');
    if (!page) return;

    // Set background color
    const bgColor = muralBgColor || '';
    page.style.backgroundColor = bgColor || '';

    // Determine pattern dot/line color based on bg darkness
    const isDark = muralBgColor && ['#1e1e2e','#1a1a2e','#0f172a','#18181b'].includes(muralBgColor);
    const dotColor = isDark ? 'rgba(255,255,255,0.12)' : 'var(--border-color)';
    const lineColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
    const majorColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.12)';

    // Apply pattern to the page (viewport) so it's always infinite
    switch (muralBgPattern) {
        case 'dots':
            page.style.backgroundImage = `radial-gradient(circle, ${dotColor} 0.8px, transparent 0.8px)`;
            page.style.backgroundSize = '32px 32px';
            break;
        case 'grid':
            // Graph paper: minor lines every 16px, major lines every 128px (8x)
            page.style.backgroundImage = `
                linear-gradient(${majorColor} 1px, transparent 1px),
                linear-gradient(90deg, ${majorColor} 1px, transparent 1px),
                linear-gradient(${lineColor} 0.5px, transparent 0.5px),
                linear-gradient(90deg, ${lineColor} 0.5px, transparent 0.5px)`;
            page.style.backgroundSize = '128px 128px, 128px 128px, 16px 16px, 16px 16px';
            break;
        case 'checks':
            page.style.backgroundImage = `
                linear-gradient(45deg, ${lineColor} 25%, transparent 25%),
                linear-gradient(-45deg, ${lineColor} 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, ${lineColor} 75%),
                linear-gradient(-45deg, transparent 75%, ${lineColor} 75%)`;
            page.style.backgroundSize = '32px 32px';
            break;
        case 'lines':
            page.style.backgroundImage = `linear-gradient(${lineColor} 1px, transparent 1px)`;
            page.style.backgroundSize = '32px 32px';
            break;
        case 'cross':
            page.style.backgroundImage = `
                radial-gradient(circle, ${dotColor} 0.8px, transparent 0.8px),
                linear-gradient(${lineColor} 1px, transparent 1px),
                linear-gradient(90deg, ${lineColor} 1px, transparent 1px)`;
            page.style.backgroundSize = '32px 32px, 32px 32px, 32px 32px';
            break;
        case 'none':
            page.style.backgroundImage = 'none';
            break;
    }
}

function saveMuralBgSettings() {
    const project = muralProjects.find(p => String(p.id) === String(muralActiveProjectId));
    if (project) {
        project.bg_pattern = muralBgPattern;
        project.bg_color = muralBgColor;
    }
    // Persist to backend sheet
    apiPost({
        action: 'update',
        sheet: 'mural_projects',
        id: muralActiveProjectId,
        payload: {
            bg_pattern: muralBgPattern || '',
            bg_color: muralBgColor || '',
            updated_at: new Date().toISOString()
        }
    }).catch(err => console.error('Failed to save bg settings:', err));
}

function loadMuralBgSettings() {
    // Load from project data (already fetched from backend)
    const project = muralProjects.find(p => String(p.id) === String(muralActiveProjectId));
    if (project && (project.bg_pattern || project.bg_color)) {
        muralBgPattern = project.bg_pattern || 'dots';
        muralBgColor = project.bg_color || '';
    } else {
        muralBgPattern = 'dots';
        muralBgColor = '';
    }
    applyMuralBackground();
}

// Board ids to remove: the board plus every sub-board nested under it.
function _muralBoardFamily(id) {
    const out = [String(id)];
    for (let i = 0; i < out.length; i++) {
        muralProjects.filter(p => p.parent_id && String(p.parent_id) === out[i] && !out.includes(String(p.id)))
            .forEach(p => out.push(String(p.id)));
    }
    return out;
}

async function _muralDeleteBoards(ids) {
    for (const pid of ids) {
        const res = await apiPost({ action: 'deleteMuralProject', id: pid });
        if (!res || !res.success) throw new Error((res && res.message) || 'Delete failed');
    }
    const gone = new Set(ids.map(String));
    muralProjects = muralProjects.filter(p => !gone.has(String(p.id)));
    state.data.mural_projects = muralProjects;
    if (Array.isArray(state.data.mural_elements)) {
        state.data.mural_elements = state.data.mural_elements.filter(e => !gone.has(String(e.project_id)));
    }
}

async function deleteMuralProject(id) {
    const project = muralProjects.find(p => String(p.id) === String(id));
    const family = _muralBoardFamily(id);
    const extra = family.length > 1 ? ` and its ${family.length - 1} sub-board${family.length > 2 ? 's' : ''}` : '';
    if (!confirm(`Delete “${(project && project.title) || 'this board'}”${extra} and everything on ${family.length > 1 ? 'them' : 'it'}?`)) return;
    try {

}
